# OpsCenter v4.6.5 — GitLab CI
# 后端测试阶段：pytest smoke tests + 覆盖率
# 说明：GitLab CE 19.2.1（VM1），runner 部署后 pipeline 自动生效

# main 推送已经覆盖发布提交；紧随其后的 annotated tag 不重复执行约 30 分钟的全量测试。
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - when: never

stages:
  - test

variables:
  # 测试数据库（GitLab CI services: postgres 提供）
  POSTGRES_DB: opscenter_test
  POSTGRES_USER: opscenter
  POSTGRES_PASSWORD: opscenter123
  DATABASE_URL: postgresql+psycopg://opscenter:opscenter123@postgres:5432/opscenter_test
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"

backend-test:
  stage: test
  # 本地预置测试镜像（python:3.12-slim + 离线 wheelhouse）：
  # 集群 Pod 无 IPv4 出网，pip 不能连 pypi；镜像由 PVE 构建后导入 k8s-worker-01。
  # 重建方法见 D:\salmon-codex-space\k3s-migration\ci\Dockerfile
  image: opscenter/ci-backend:5.0.1
  interruptible: true
  services:
    - postgres:16-alpine
  before_script:
    - pip install --no-index --find-links=/wheels -r backend/requirements.txt pytest pytest-cov
  script:
    - cd backend && python -m pytest tests/ -v --cov=app --cov-report=term-missing
  cache:
    key: pip
    paths:
      - .pip-cache
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
