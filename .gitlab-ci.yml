# OpsCenter v4.6.5 — GitLab CI
# 后端测试阶段：pytest smoke tests + 覆盖率
# 说明：GitLab CE 19.2.1（VM1），runner 部署后 pipeline 自动生效

# main 推送已经覆盖发布提交；紧随其后的 annotated tag 不重复执行约 30 分钟的全量测试。
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - when: never

stages:
  - test
  - deploy

variables:
  # 测试数据库（GitLab CI services: postgres 提供）
  POSTGRES_DB: opscenter_test
  POSTGRES_USER: opscenter
  POSTGRES_PASSWORD: opscenter123
  DATABASE_URL: postgresql+psycopg://opscenter:opscenter123@postgres:5432/opscenter_test
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  # 集群 Pod 出站 IPv4 只放行 80/443（PVE k8s-vm-forward，2026-09-11）；pypi.org 可达但慢，统一走国内镜像。
  PIP_INDEX_URL: "https://mirrors.cloud.tencent.com/pypi/simple/"

backend-test:
  stage: test
  image: python:3.12-slim
  interruptible: true
  services:
    - postgres:16-alpine
  before_script:
    - pip install -r backend/requirements.txt pytest pytest-cov
  script:
    - cd backend && python -m pytest tests/ -v --cov=app --cov-report=term-missing
  cache:
    key: pip
    paths:
      - .pip-cache
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# main 通过测试后触发 Jenkins（opscenter-e2e）：
#   Jenkins → PVE 构建镜像并分发到 K3s 节点 → 自动部署测试环境(VM100:8090) → 【人工确认】部署生产。
# 变量（项目级，已在 GitLab 配置）：JENKINS_URL / JENKINS_USER / JENKINS_API_TOKEN(masked) / JENKINS_JOB。
trigger-jenkins:
  stage: deploy
  image: python:3.12-slim
  needs: ["backend-test"]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - |
      python3 - <<'PY'
      import base64, http.cookiejar, json, os, urllib.request

      base = os.environ["JENKINS_URL"].rstrip("/")
      auth = "Basic " + base64.b64encode(
          f'{os.environ["JENKINS_USER"]}:{os.environ["JENKINS_API_TOKEN"]}'.encode()
      ).decode()
      opener = urllib.request.build_opener(
          urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar())
      )

      def call(path, data=None, extra_headers=None):
          headers = {"Authorization": auth}
          headers.update(extra_headers or {})
          return opener.open(urllib.request.Request(base + path, data=data, headers=headers), timeout=20)

      crumb = json.load(call("/crumbIssuer/api/json"))["crumb"]          # CSRF 令牌（与 cookie 成对）
      job = os.environ.get("JENKINS_JOB", "opscenter-e2e")
      url = f"/job/{job}/buildWithParameters?GIT_SHA={os.environ['CI_COMMIT_SHA']}&DEPLOY_TEST=true"
      resp = call(url, data=b"", extra_headers={"Jenkins-Crumb": crumb})
      print(f"jenkins trigger {job} <- {os.environ['CI_COMMIT_SHA']}: HTTP {resp.status}")
      PY
