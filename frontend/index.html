<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpsCenter v3.1 运维工作台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<style>
:root{--bg:#0d1117;--bg2:#161b22;--card:#1c2330;--card-hover:#243447;--border:#30363d;--text1:#e6edf3;--text2:#8b949e;--accent:#2dd4bf;--accent2:#0d9488;--green:#22c55e;--orange:#f59e0b;--red:#ef4444;--purple:#8b5cf6;--blue:#3b82f6;--radius:10px;--sidebar-w:220px}
.light{--bg:#f0f2f5;--bg2:#fff;--card:#fff;--card-hover:#f5f5f5;--border:#e5e7eb;--text1:#1f2937;--text2:#6b7280}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:-apple-system,"Microsoft YaHei","PingFang SC",system-ui,sans-serif}
body{background:var(--bg);color:var(--text1);transition:background .3s,color .3s}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text2)}

/* ===== Layout ===== */
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:40;transition:width .2s}
.sidebar.collapsed{width:60px}
.sidebar.collapsed .logo-text,.sidebar.collapsed .nav-item span:not(.nav-icon),.sidebar.collapsed .nav-section-title,.sidebar.collapsed .sidebar-footer-text{display:none}
.sidebar.collapsed .nav-item{justify-content:center}
.sidebar-logo{padding:16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.sidebar-logo .logo-icon{width:34px;height:34px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#0d1117;flex-shrink:0}
.sidebar-logo .logo-text{font-size:14px;font-weight:600}
.sidebar-logo .logo-text small{color:var(--text2);display:block;font-size:10px;font-weight:400}
.sidebar-nav{padding:10px 8px;flex:1;overflow-y:auto}
.nav-section-title{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:1px;padding:4px 12px;margin-bottom:4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text2);transition:all .15s;margin-bottom:2px}
.nav-item:hover{background:var(--card);color:var(--text1)}
.nav-item.active{background:rgba(45,212,191,.12);color:var(--accent);font-weight:500}
.nav-item .nav-icon{width:18px;height:18px;flex-shrink:0}
.sidebar-footer{padding:10px 14px;border-top:1px solid var(--border)}
.sidebar-footer .online-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:5px;box-shadow:0 0 5px var(--green)}
.sidebar-footer-text{font-size:11px;color:var(--text2)}

/* Main */
.main{margin-left:var(--sidebar-w);flex:1;min-width:0;transition:margin-left .2s}
.main.expanded{margin-left:60px}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:30}
.topbar-left{display:flex;align-items:center;gap:14px}
.topbar h2{font-size:16px;font-weight:600}
.topbar-right{display:flex;align-items:center;gap:12px}
.search-box{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:13px}
.search-box input{background:none;border:none;outline:none;color:var(--text1);font-size:13px;width:160px}
.search-box svg{width:14px;height:14px;color:var(--text2)}
.clock{font-size:12px;color:var(--text2);font-variant-numeric:tabular-nums}
.icon-btn{background:none;border:1px solid var(--border);border-radius:8px;padding:6px 8px;cursor:pointer;color:var(--text2);display:flex;align-items:center;transition:all .15s}
.icon-btn:hover{color:var(--text1);border-color:var(--accent)}

/* Content */
.content{padding:20px 24px}
.stat-row{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;flex:1;min-width:120px}
.stat-card .num{font-size:28px;font-weight:700;line-height:1.1}
.stat-card .label{font-size:11px;color:var(--text2);margin-top:4px}
.stat-card.green .num{color:var(--green)}
.stat-card.red .num{color:var(--red)}
.stat-card.blue .num{color:var(--blue)}
.stat-card.purple .num{color:var(--purple)}
.stat-card.orange .num{color:var(--orange)}
.stat-card.teal .num{color:var(--accent)}

/* ===== Service Group ===== */
.group-section{margin-bottom:24px}
.group-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;cursor:pointer;padding:8px 0}
.group-header .group-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.group-header .group-name{font-size:15px;font-weight:600}
.group-header .group-count{font-size:12px;color:var(--text2);background:var(--bg2);padding:2px 8px;border-radius:10px}
.group-header .group-actions{margin-left:auto;display:flex;gap:4px}
.group-header .group-actions button{background:none;border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:11px;color:var(--text2);cursor:pointer;transition:all .15s}
.group-header .group-actions button:hover{color:var(--accent);border-color:var(--accent)}

.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.svc-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;transition:all .2s;position:relative}
.svc-card:hover{border-color:var(--accent);box-shadow:0 2px 12px rgba(45,212,191,.08)}
.svc-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.svc-name{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.svc-name .status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block}
.svc-name .status-dot.online{background:var(--green);box-shadow:0 0 6px var(--green)}
.svc-name .status-dot.offline{background:var(--red);box-shadow:0 0 6px var(--red)}
.svc-name .status-dot.unknown{background:var(--orange)}
.svc-name .status-dot.server_offline{background:var(--orange);box-shadow:0 0 6px var(--orange)}
.svc-name .status-dot.checking{background:var(--blue);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.svc-badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:500}
.svc-badge.manual{background:rgba(45,212,191,.15);color:var(--accent)}
.svc-badge.auto{background:rgba(59,130,246,.15);color:var(--blue)}
.svc-badge.srv-offline{background:rgba(245,158,11,.15);color:var(--orange)}
.svc-desc{font-size:12px;color:var(--text2);margin-top:6px}
.svc-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.svc-tag{font-size:10px;padding:2px 7px;border-radius:6px;background:var(--bg2);color:var(--text2);border:1px solid var(--border)}
.svc-url{font-size:11px;color:var(--text2);margin-top:8px;word-break:break-all;font-family:monospace}
.svc-url a{color:var(--accent);text-decoration:none}
.svc-url a:hover{text-decoration:underline}
.svc-auth{margin-top:8px;display:flex;gap:12px;font-size:12px;align-items:center}
.svc-auth .auth-item{display:flex;align-items:center;gap:4px}
.svc-auth .auth-label{color:var(--text2)}
.svc-auth .auth-val{font-family:monospace;background:var(--bg2);padding:1px 6px;border-radius:4px;cursor:pointer}
.svc-auth .auth-val.hidden{filter:blur(3px);user-select:none}
.svc-auth .auth-val:hover{filter:none}
.svc-footer{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn-sm{font-size:11px;padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:none;color:var(--text2);cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:4px}
.btn-sm:hover{color:var(--accent);border-color:var(--accent)}
.btn-sm.primary{background:var(--accent);color:#0d1117;border-color:var(--accent);font-weight:500}
.btn-sm.primary:hover{background:var(--accent2)}
.btn-sm.danger{color:var(--red);border-color:var(--red)}
.btn-sm.danger:hover{background:rgba(239,68,68,.1)}
.svc-move-select{font-size:11px;padding:3px 6px;border-radius:6px;border:1px solid var(--border);background:var(--bg2);color:var(--text1);cursor:pointer}
.svc-server-info{font-size:11px;color:var(--text2);margin-top:4px;display:flex;align-items:center;gap:4px}

/* ===== Group Management Modal ===== */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:24px;min-width:460px;max-width:90vw;max-height:80vh;overflow-y:auto}
.modal h3{font-size:16px;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.modal-row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.modal-row label{font-size:13px;min-width:70px;color:var(--text2)}
.modal-row input,.modal-row select{flex:1;padding:6px 10px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text1);font-size:13px}
.modal-row input:focus,.modal-row select:focus{outline:none;border-color:var(--accent)}
.group-list-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;background:var(--card)}
.group-list-item .g-dot{width:12px;height:12px;border-radius:4px;flex-shrink:0}
.group-list-item .g-name{font-size:13px;font-weight:500}
.group-list-item .g-order{font-size:11px;color:var(--text2)}
.group-list-item .g-btns{margin-left:auto;display:flex;gap:4px}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid var(--border)}

/* ===== Monitor Page ===== */
.monitor-select{margin-bottom:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.monitor-select select{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text1);font-size:13px}
.monitor-info-bar{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);font-size:12px;color:var(--text2)}
.monitor-info-bar span{display:flex;align-items:center;gap:4px}
.metric-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.metric-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:all .2s;position:relative}
.metric-card:hover{border-color:var(--accent)}
.metric-card.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(45,212,191,.18)}
.metric-card .mc-icon{font-size:18px;margin-bottom:4px}
.metric-card .mc-label{font-size:11px;color:var(--text2)}
.metric-card .mc-value{font-size:22px;font-weight:700;margin-top:1px;line-height:1.2}
.metric-card .mc-bar{height:4px;background:var(--border);border-radius:2px;margin-top:6px;overflow:hidden}
.metric-card .mc-bar-fill{height:100%;border-radius:2px;transition:width .5s}
.metric-card .mc-detail{font-size:10px;color:var(--text2);margin-top:3px}
.chart-section{margin-bottom:20px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.chart-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.chart-header .ch-title{font-size:13px;font-weight:600}
.chart-metric-tabs{display:flex;gap:4px}
.chart-metric-tabs button{font-size:11px;padding:3px 10px;border-radius:6px;border:1px solid var(--border);background:none;color:var(--text2);cursor:pointer;transition:all .15s}
.chart-metric-tabs button.active{background:var(--accent);color:#0d1117;border-color:var(--accent);font-weight:500}
.chart-time-tabs{display:flex;gap:4px}
.chart-time-tabs button{font-size:11px;padding:3px 10px;border-radius:6px;border:1px solid var(--border);background:none;color:var(--text2);cursor:pointer;transition:all .15s}
.chart-time-tabs button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.chart-container{height:280px;position:relative}
.container-table{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:auto;max-height:400px}
.container-table table{width:100%;border-collapse:collapse;font-size:12px}
.container-table th{background:var(--bg2);padding:8px 12px;text-align:left;font-weight:500;position:sticky;top:0;z-index:1}
.container-table td{padding:7px 12px;border-top:1px solid var(--border)}
.running-dot{color:var(--green);font-weight:700}

/* ===== Toolbox Page ===== */
.terminal-box{background:#0c0c0c;border:1px solid var(--border);border-radius:var(--radius);padding:12px;font-family:'Cascadia Code','Consolas',monospace;font-size:13px;color:var(--green);min-height:300px;max-height:400px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
.terminal-input-row{display:flex;gap:8px;margin-top:10px}
.terminal-input-row input{flex:1;padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--green);font-family:monospace;font-size:13px}
.terminal-input-row input:focus{outline:none;border-color:var(--accent)}

/* ===== Resources Page ===== */
.server-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.server-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.server-card h4{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.server-card .s-host{font-size:12px;color:var(--text2);margin-bottom:8px}
.srv-btn-row{display:flex;gap:6px}

/* ===== Responsive ===== */
@media(max-width:768px){.sidebar{width:60px}.sidebar .logo-text,.sidebar .nav-item span:not(.nav-icon),.sidebar .nav-section-title,.sidebar .sidebar-footer-text{display:none}.main{margin-left:60px}.svc-grid{grid-template-columns:1fr}.stat-card{min-width:100px}}
</style>

<body>
<div id="app"></div>
<script>
const { createApp, ref, reactive, computed, onMounted, onUnmounted, watch, nextTick } = Vue;

const API = '/ops/api/v2';
const iconMap = {code:'#fa-code',chart:'#fa-chart',tool:'#fa-tool',database:'#fa-database',globe:'#fa-globe',bolt:'#fa-bolt',box:'#fa-box',server:'#fa-server'};

createApp({
  setup() {
    const currentPage = ref('nav');
    const darkMode = ref(true);
    const searchQuery = ref('');
    const clock = ref('');
    const collapsed = ref(false);

    // ========== Data ==========
    const groupConfig = reactive({ groups: [], serviceGroupMap: {} });
    const manualServices = ref([]);   // from services.json
    const autoServices = ref([]);     // from /api/v2/services-with-status
    const servers = ref([]);
    const currentServerId = ref('');
    const monitorData = ref(null);
    const containers = ref([]);
    const selectedMetric = ref('cpu');
    const historyHours = ref(24);
    const historyData = ref([]);
    let echartsLib = null;
    let chartInstance = null;
    const chartBox = ref(null);
    let autoRefreshTimer = null;

    // ========== Modals ==========
    const showGroupModal = ref(false);
    const newGroupName = ref('');
    const newGroupId = ref('');
    const newGroupColor = ref('#64748b');

    // ========== Terminal ==========
    const termLines = ref(['$ Welcome to OpsCenter Terminal Simulator', '$ Type "help" for commands']);
    const termInput = ref('');
    const cmdTemplates = {
      'Docker': ['docker ps','docker ps -a','docker logs --tail 50 <container>','docker stats --no-stream','docker compose -f /opt/cicd/docker-compose.yml ps','docker compose -f /opt/cicd/docker-compose.yml restart <service>'],
      'System': ['df -h','free -h','top -bn1 | head -20','uptime','journalctl -u opscenter-backend -n 20 --no-pager','ss -tlnp'],
      'Network': ['curl -s http://localhost/gitea/ -o /dev/null -w "%{http_code}"','netstat -tlnp 2>/dev/null || ss -tlnp','curl -s http://localhost:9091/api/v2/health','ufw status'],
      'Security': ['fail2ban-client status','fail2ban-client status sshd','cat /etc/fail2ban/jail.local | head -30','ausearch -m avc -ts recent 2>/dev/null | tail -5','aide --check 2>/dev/null | tail -10']
    };
    const activeCmdGroup = ref('Docker');

    // ========== Clock ==========
    let clockTimer;
    function updateClock() { clock.value = new Date().toLocaleTimeString('zh-CN',{hour12:false}); }

    // ========== API helpers ==========
    async function apiGet(url) { const r = await fetch(url); if (!r.ok) throw new Error(r.status); return r.json(); }
    async function apiPost(url, body) { return fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) }); }
    async function apiPut(url, body) { return fetch(url, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) }); }
    async function apiPatch(url) { return fetch(url, { method:'PATCH' }); }
    async function apiDelete(url) { return fetch(url, { method:'DELETE' }); }

    // ========== Load groups.json via backend API ==========
    async function loadGroupConfig() {
      try {
        const data = await apiGet(`${API}/group-config`);
        groupConfig.groups = data.groups || [];
        groupConfig.serviceGroupMap = data.serviceGroupMap || {};
      } catch(e) { console.warn('group-config load failed:', e.message); }
    }

    // ========== Load services.json (manual) ==========
    async function loadManualServices() {
      try {
        const data = await apiGet('/ops/groups.json/../services.json');
        if (!data.groups) { manualServices.value = []; return; }
        const Host = location.host;
        const proto = location.protocol;
        const svcs = [];
        for (const g of data.groups) {
          for (const s of (g.services || [])) {
            let fullUrl = s.url || '';
            if (fullUrl.startsWith('/')) fullUrl = `${proto}//${Host}${fullUrl}`;
            else if (fullUrl.startsWith(':')) fullUrl = `${proto}//${Host}${fullUrl}`;
            else if (!fullUrl.startsWith('http')) fullUrl = `${proto}//${Host}/${fullUrl}`;
            svcs.push({
              ...s, fullUrl, origin: 'manual',
              status: 'checking', // will be updated by health check
              serviceKey: `manual:${s.name}`,
              groupId: groupConfig.serviceGroupMap[`manual:${s.name}`] || null,
              serverStatus: 'online', // manual services assumed online server
            });
          }
        }
        manualServices.value = svcs;
      } catch(e) { console.warn('services.json load failed:', e.message); manualServices.value = []; }
    }

    // ========== Load auto services via backend API ==========
    async function loadAutoServices() {
      try {
        const data = await apiGet(`${API}/services-with-status`);
        const svcs = data.map(s => ({
          id: s.id, serverId: s.server_id, name: s.name,
          url: s.url, category: s.category, icon: s.icon,
          description: s.description, source: s.source,
          status: s.status === 'up' ? 'online' : s.status === 'down' ? 'offline' : 'unknown',
          pinned: s.pinned, containerName: s.container_name,
          image: s.image, ports: s.ports,
          serverName: s.server_name, serverHost: s.server_host,
          serverStatus: s.server_status, serverIsLocal: s.server_is_local,
          origin: 'auto',
          serviceKey: `auto:${s.server_id}:${s.id}`,
          groupId: groupConfig.serviceGroupMap[`auto:${s.server_id}:${s.id}`] || null,
          fullUrl: '',
        }));
        // Build fullUrl for auto services
        const proto = location.protocol;
        const Host = location.host;
        for (const s of svcs) {
          if (!s.url) { s.fullUrl = ''; continue; }
          if (s.url.startsWith('http')) { s.fullUrl = s.url; }
          else if (s.url.startsWith('/')) { s.fullUrl = `${proto}//${Host}${s.url}`; }
          else if (s.url.startsWith(':')) { s.fullUrl = `${proto}//${Host}${s.url}`; }
          else { s.fullUrl = `${proto}//${s.serverHost}${s.url.startsWith('/') ? '' : '/'}${s.url}`; }
        }
        autoServices.value = svcs;
      } catch(e) { console.warn('auto services load failed:', e.message); autoServices.value = []; }
    }

    // ========== Health check manual services via backend ==========
    async function checkManualServices() {
      const promises = manualServices.value.map(async (svc) => {
        if (!svc.fullUrl) { svc.status = 'unknown'; return; }
        try {
          const res = await apiGet(`${API}/health-check-url?url=${encodeURIComponent(svc.fullUrl)}`);
          svc.status = res.status === 'online' ? 'online' : 'offline';
        } catch(e) { svc.status = 'offline'; }
      });
      await Promise.allSettled(promises);
    }

    // ========== Compute effective status ==========
    function effectiveStatus(svc) {
      if (svc.origin === 'auto' && svc.serverStatus === 'offline') return 'server_offline';
      if (svc.status === 'checking') return 'checking';
      if (svc.status === 'online') return 'online';
      if (svc.status === 'offline') return 'offline';
      return 'unknown';
    }

    // ========== Compute service groups ==========
    const allServices = computed(() => {
      const all = [...manualServices.value, ...autoServices.value];
      return all;
    });

    const serviceGroups = computed(() => {
      // Get groups from config, sorted by order
      const groups = [...groupConfig.groups].sort((a, b) => (a.order || 100) - (b.order || 100));
      const result = [];

      for (const g of groups) {
        const svcs = allServices.value.filter(s => {
          // Priority 1: explicit mapping in serviceGroupMap
          const mapped = groupConfig.serviceGroupMap[s.serviceKey];
          if (mapped) return mapped === g.id;
          // Priority 2: for manual services, check if groupId matches
          if (s.groupId && s.groupId === g.id) return true;
          // Priority 3: for auto services, match by category name
          if (s.origin === 'auto' && s.category) {
            const catNorm = (s.category || '').toLowerCase().replace(/[\s\-_]/g, '');
            const gNorm = (g.name || '').toLowerCase().replace(/[\s\-_]/g, '');
            if (catNorm === gNorm || catNorm.includes(gNorm) || gNorm.includes(catNorm)) return true;
          }
          return false;
        });
        if (svcs.length > 0 || g.id !== 'ungrouped') {
          result.push({ ...g, services: svcs });
        }
      }

      // Add ungrouped services
      const ungrouped = allServices.value.filter(s => {
        const mapped = groupConfig.serviceGroupMap[s.serviceKey];
        if (mapped) return false; // has mapping
        if (s.groupId && s.groupId !== 'ungrouped') return false; // has explicit group
        // Check if auto service was already matched by category
        if (s.origin === 'auto' && s.category) {
          const matched = result.some(g => {
            if (g.id === 'ungrouped') return false;
            const catNorm = (s.category || '').toLowerCase().replace(/[\s\-_]/g, '');
            const gNorm = (g.name || '').toLowerCase().replace(/[\s\-_]/g, '');
            return catNorm === gNorm || catNorm.includes(gNorm) || gNorm.includes(catNorm);
          });
          if (matched) return false;
        }
        return true;
      });
      if (ungrouped.length > 0) {
        const ug = result.find(g => g.id === 'ungrouped');
        if (ug) { ug.services = ungrouped; }
        else { result.push({ id: 'ungrouped', name: '未分组', order: 999, color: '#475569', icon: 'box', services: ungrouped }); }
      }

      return result;
    });

    const filteredGroups = computed(() => {
      if (!searchQuery.value) return serviceGroups.value;
      const q = searchQuery.value.toLowerCase();
      return serviceGroups.value.map(g => ({
        ...g,
        services: g.services.filter(s =>
          s.name.toLowerCase().includes(q) ||
          (s.desc || s.description || '').toLowerCase().includes(q) ||
          (s.tags || []).some(t => t.toLowerCase().includes(q))
        )
      })).filter(g => g.services.length > 0);
    });

    // ========== Stats ==========
    const stats = computed(() => {
      const all = allServices.value;
      const online = all.filter(s => effectiveStatus(s) === 'online').length;
      const offline = all.filter(s => effectiveStatus(s) === 'offline').length;
      const srvOff = all.filter(s => effectiveStatus(s) === 'server_offline').length;
      const unknown = all.filter(s => effectiveStatus(s) === 'unknown' || effectiveStatus(s) === 'checking').length;
      const manual = all.filter(s => s.origin === 'manual').length;
      const auto = all.filter(s => s.origin === 'auto').length;
      return { total: all.length, online, offline, srvOff, unknown, manual, auto };
    });

    // ========== Group management ==========
    async function addGroup() {
      if (!newGroupId.value || !newGroupName.value) return;
      try {
        await apiPost(`${API}/group-config/groups`, { id: newGroupId.value, name: newGroupName.value, order: (groupConfig.groups.length + 1) * 10, color: newGroupColor.value, icon: 'box' });
        newGroupId.value = ''; newGroupName.value = ''; newGroupColor.value = '#64748b';
        await loadGroupConfig();
      } catch(e) { alert('添加分组失败: ' + e.message); }
    }

    async function deleteGroup(gid) {
      if (gid === 'ungrouped') { alert('不能删除"未分组"'); return; }
      if (!confirm(`确定删除分组？映射到此分组的服务将移至"未分组"`)) return;
      try {
        await apiDelete(`${API}/group-config/groups/${gid}`);
        await loadGroupConfig();
      } catch(e) { alert('删除分组失败: ' + e.message); }
    }

    async function moveServiceToGroup(serviceKey, groupId) {
      try {
        await fetch(`${API}/group-config/service-map?serviceKey=${encodeURIComponent(serviceKey)}&groupId=${encodeURIComponent(groupId)}`, { method: 'PATCH' });
        await loadGroupConfig();
      } catch(e) { console.error('move failed:', e); }
    }

    // ========== Copy ==========
    function copyText(text) { navigator.clipboard.writeText(text).catch(() => {}); }

    // ========== Monitor ==========
    async function loadServers() {
      try {
        const data = await apiGet(`${API}/servers`);
        servers.value = data.servers || data || [];
        if (servers.value.length) {
          const saved = localStorage.getItem('oc-server');
          currentServerId.value = (saved && servers.value.find(s => s.id === saved)) ? saved : servers.value[0].id;
        }
      } catch(e) { console.warn('servers load failed:', e.message); }
    }

    async function loadMonitor() {
      if (!currentServerId.value) return;
      try {
        const data = await apiGet(`${API}/servers/${currentServerId.value}/monitor`);
        monitorData.value = data;
        containers.value = data.containers || [];
      } catch(e) { console.warn('monitor load failed:', e.message); }
    }

    async function loadHistory() {
      if (!currentServerId.value) return;
      try {
        const data = await apiGet(`${API}/servers/${currentServerId.value}/history?metric=${selectedMetric.value}&hours=${historyHours.value}`);
        historyData.value = data.values || [];
        await nextTick();
        renderChart();
      } catch(e) { console.warn('history load failed:', e.message); }
    }

    async function loadEcharts() {
      if (echartsLib) return echartsLib;
      return new Promise((resolve) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js';
        s.onload = () => { echartsLib = window.echarts; resolve(echartsLib); };
        s.onerror = () => { console.error('ECharts load failed'); resolve(null); };
        document.head.appendChild(s);
      });
    }

    async function initChart() {
      if (!echartsLib) await loadEcharts();
      if (!echartsLib || !chartBox.value) return;
      if (chartInstance) { chartInstance.dispose(); }
      chartInstance = echartsLib.init(chartBox.value, darkMode.value ? 'dark' : null);
      window.addEventListener('resize', () => chartInstance && chartInstance.resize());
    }

    function renderChart() {
      if (!chartInstance || !echartsLib) return;
      const metricLabels = {cpu:'CPU 使用率 (%)',memory:'内存使用率 (%)',disk:'磁盘使用率 (%)',net_rx:'网络入流量 (B/s)',net_tx:'网络出流量 (B/s)',load1:'系统负载 (1min)',load5:'系统负载 (5min)',load15:'系统负载 (15min)',disk_read:'磁盘读取 (B/s)',disk_write:'磁盘写入 (B/s)'};
      const colors = {cpu:'#22c55e',memory:'#3b82f6',disk:'#f59e0b',net_rx:'#8b5cf6',net_tx:'#06b6d4',load1:'#f97316',load5:'#f97316',load15:'#f97316',disk_read:'#22c55e',disk_write:'#ef4444'};
      const title = metricLabels[selectedMetric.value] || selectedMetric.value;
      const color = colors[selectedMetric.value] || '#2dd4bf';
      const h = historyData.value;
      const normalized = Array.isArray(h) ? h.map(p => {
        if (Array.isArray(p)) return { ts: p[0] * 1000, v: parseFloat(p[1]) };
        return { ts: p.timestamp || p.time || p.x, v: p.value ?? p.y ?? 0 };
      }) : [];
      const xData = normalized.map(p => {
        const d = new Date(p.ts);
        if (historyHours.value > 24) return (d.getMonth()+1)+'/'+d.getDate()+' '+d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
        return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
      });
      const yData = normalized.map(p => p.v);
      const isDarkVal = darkMode.value;
      chartInstance.setOption({
        backgroundColor:'transparent',
        textStyle:{color:isDarkVal?'#94a3b8':'#64748b'},
        grid:{left:55,right:15,top:20,bottom:30},
        tooltip:{trigger:'axis',backgroundColor:isDarkVal?'#1e293b':'#fff',borderColor:isDarkVal?'#334155':'#e2e8f0',textStyle:{color:isDarkVal?'#e2e8f0':'#1e293b',fontSize:11},
          formatter:function(params){const p=params[0];return p.name+'<br/><b>'+title+'</b>: '+parseFloat(p.value).toFixed(2);}
        },
        xAxis:{type:'category',data:xData,axisLine:{lineStyle:{color:isDarkVal?'#334155':'#e2e8f0'}},axisLabel:{fontSize:10},boundaryGap:false},
        yAxis:{type:'value',axisLine:{show:false},splitLine:{lineStyle:{color:isDarkVal?'#1e293b':'#f1f5f9'}},axisLabel:{fontSize:10}},
        series:[{type:'line',data:yData,smooth:true,symbol:'none',lineStyle:{width:2,color:color},
          areaStyle:{color:new echartsLib.graphic.LinearGradient(0,0,0,1,[{offset:0,color:color+'40'},{offset:1,color:color+'05'}])}
        }]
      }, true);
    }

    function getMetric(key) {
      if (!monitorData.value) return null;
      const m = monitorData.value.metrics || {};
      return m[key] != null ? m[key] : null;
    }

    function formatBytes(bytes) {
      if (bytes == null || bytes === 0) return '0 B';
      const units = ['B','KB','MB','GB','TB'];
      const i = Math.floor(Math.log(bytes) / Math.log(1024));
      return (bytes / Math.pow(1024, i)).toFixed(1) + ' ' + units[i];
    }

    function formatUptime(seconds) {
      if (seconds == null || seconds <= 0) return '-';
      const d = Math.floor(seconds / 86400);
      const h = Math.floor((seconds % 86400) / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      if (d > 0) return d + '天' + h + '小时';
      if (h > 0) return h + '小时' + m + '分';
      return m + '分钟';
    }

    function formatContainerPorts(ports) {
      if (!ports || ports === '-') return '-';
      return ports.split(',').map(p => { const m = p.trim().match(/:(\d+)$/); return m ? m[1] : p.trim(); }).filter((v, i, a) => a.indexOf(v) === i).join(', ');
    }

    const metricCards = computed(() => {
      const m = monitorData.value?.metrics || {};
      const rx = m.net_rx || 0;
      const tx = m.net_tx || 0;
      const netBps = rx + tx;
      return [
        {key:'cpu',icon:'⚡',label:'CPU',value:m.cpu||0,display:(m.cpu||0).toFixed(1)+'%',color:'#22c55e',detail:(m.cpu_count||0)+' 核心'},
        {key:'memory',icon:'💾',label:'内存',value:m.memory||0,display:(m.memory||0).toFixed(1)+'%',color:'#3b82f6',detail:formatBytes(m.memory_used)+' / '+formatBytes(m.memory_total)},
        {key:'disk',icon:'💿',label:'磁盘',value:m.disk||0,display:(m.disk||0).toFixed(1)+'%',color:'#f59e0b',detail:formatBytes(m.disk_avail)+' 可用'},
        {key:'net_rx',icon:'📥',label:'网络入',value:0,display:formatBytes(rx)+'/s',color:'#8b5cf6',detail:'接收流量'},
        {key:'net_tx',icon:'📤',label:'网络出',value:0,display:formatBytes(tx)+'/s',color:'#06b6d4',detail:'发送流量'},
        {key:'load1',icon:'📊',label:'负载',value:0,display:(m.load1||0).toFixed(2),color:'#f97316',detail:'1m/'+(m.load5||0).toFixed(2)+' 5m/'+(m.load15||0).toFixed(2)+' 15m'},
        {key:'disk_read',icon:'⬆️',label:'磁盘读',value:0,display:formatBytes(m.disk_read||0)+'/s',color:'#22c55e',detail:'读取速率'},
        {key:'disk_write',icon:'⬇️',label:'磁盘写',value:0,display:formatBytes(m.disk_write||0)+'/s',color:'#ef4444',detail:'写入速率'},
      ];
    });

    // ========== Terminal ==========
    function execCmd() {
      const cmd = termInput.value.trim();
      if (!cmd) return;
      termLines.value.push(`$ ${cmd}`);
      if (cmd === 'help') { termLines.value.push('Available: help, clear, docker ps, df -h, free -h, uptime, ping <host>'); }
      else if (cmd === 'clear') { termLines.value = []; }
      else { termLines.value.push(`[simulated] ${cmd} -> OK`); }
      termInput.value = '';
    }

    function insertCmd(cmd) { termInput.value = cmd; }

    // ========== Resource ==========
    async function triggerScan(sid) {
      try { await apiPost(`${API}/servers/${sid}/scan`); await loadMonitor(); } catch(e) { alert('扫描失败'); }
    }

    // ========== Init ==========
    onMounted(async () => {
      updateClock();
      clockTimer = setInterval(updateClock, 1000);
      await loadGroupConfig();
      await Promise.all([loadManualServices(), loadAutoServices(), loadServers()]);
      checkManualServices();
      await loadMonitor();
      await loadEcharts();
    });
    onUnmounted(() => { clearInterval(clockTimer); if (autoRefreshTimer) clearInterval(autoRefreshTimer); });

    // Watch server change for monitor
    watch(currentServerId, async () => {
      await loadMonitor();
      await loadHistory();
    });
    watch(currentPage, async (val) => {
      if (val === 'monitor') {
        await loadMonitor();
        await nextTick();
        await initChart();
        await loadHistory();
        if (autoRefreshTimer) clearInterval(autoRefreshTimer);
        autoRefreshTimer = setInterval(loadMonitor, 15000);
      } else {
        if (autoRefreshTimer) { clearInterval(autoRefreshTimer); autoRefreshTimer = null; }
      }
    });
    watch(darkMode, () => { if (chartInstance) { initChart(); renderChart(); } });

    // ========== Template data ==========
    return {
      currentPage, darkMode, searchQuery, clock, collapsed,
      groupConfig, manualServices, autoServices,
      filteredGroups, stats, effectiveStatus,
      showGroupModal, newGroupName, newGroupId, newGroupColor,
      addGroup, deleteGroup, moveServiceToGroup,
      copyText, iconMap,
      servers, currentServerId, monitorData, containers,
      selectedMetric, historyHours, historyData, chartBox, metricCards,
      getMetric, loadMonitor, loadHistory, formatBytes, formatUptime, formatContainerPorts,
      termLines, termInput, execCmd, insertCmd, cmdTemplates, activeCmdGroup,
      triggerScan,
    };
  },

  template: `
<div class="app" :class="{light: !darkMode}">
  <!-- Sidebar -->
  <aside class="sidebar" :class="{collapsed}">
    <div class="sidebar-logo">
      <div class="logo-icon">O</div>
      <div class="logo-text" v-show="!collapsed">OpsCenter<small>运维工作台 v3.1</small></div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-title">主导航</div>
      <div class="nav-item" :class="{active:currentPage==='nav'}" @click="currentPage='nav'">
        <svg class="nav-icon"><use href="#fa-server"/></svg><span>服务导航</span>
      </div>
      <div class="nav-item" :class="{active:currentPage==='monitor'}" @click="currentPage='monitor'">
        <svg class="nav-icon"><use href="#fa-gauge"/></svg><span>监控中心</span>
      </div>
      <div class="nav-item" :class="{active:currentPage==='tools'}" @click="currentPage='tools'">
        <svg class="nav-icon"><use href="#fa-wrench"/></svg><span>工具箱</span>
      </div>
      <div class="nav-item" :class="{active:currentPage==='resources'}" @click="currentPage='resources'">
        <svg class="nav-icon"><use href="#fa-layer-group"/></svg><span>资源管理</span>
      </div>
      <div class="nav-section-title">服务器</div>
      <div class="nav-item" v-for="srv in servers" :key="srv.id" @click="currentServerId=srv.id; currentPage='monitor'">
        <svg class="nav-icon"><use href="#fa-server"/></svg><span>{{srv.name}}</span>
      </div>
    </nav>
    <div class="sidebar-footer">
      <span class="online-dot"></span><span class="sidebar-footer-text">{{servers.length}} 服务器 · {{stats.total}} 服务</span>
    </div>
  </aside>

  <!-- Main -->
  <div class="main" :class="{expanded:collapsed}">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn" @click="collapsed=!collapsed" :title="collapsed?'展开':'折叠'">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M2 3h12v1.5H2zm0 4.25h12v1.5H2zm0 4.25h8v1.5H2z"/></svg>
        </button>
        <h2>{{currentPage==='nav'?'服务导航':currentPage==='monitor'?'监控中心':currentPage==='tools'?'工具箱':'资源管理'}}</h2>

      <div class="topbar-right">
        <div class="search-box" v-if="currentPage==='nav'">
          <svg><use href="#fa-globe" style="width:14px;height:14px"/></svg>
          <input v-model="searchQuery" placeholder="搜索服务... (Ctrl+K)">
        </div>
        <span class="clock">{{clock}}</span>
        <button class="icon-btn" @click="darkMode=!darkMode" :title="darkMode?'亮色模式':'暗色模式'">{{darkMode?'☀':'🌙'}}</button>
      </div>
    </header>

    <!-- ===== NAV PAGE ===== -->
    <div class="content" v-if="currentPage==='nav'">
      <div class="stat-row">
        <div class="stat-card teal"><div class="num">{{stats.total}}</div><div class="label">服务总数</div></div>
        <div class="stat-card green"><div class="num">{{stats.online}}</div><div class="label">在线服务</div></div>
        <div class="stat-card red"><div class="num">{{stats.offline}}</div><div class="label">离线服务</div></div>
        <div class="stat-card orange"><div class="num">{{stats.srvOff}}</div><div class="label">服务器离线</div></div>
        <div class="stat-card purple"><div class="num">{{stats.manual}}</div><div class="label">手动配置</div></div>
        <div class="stat-card blue"><div class="num">{{stats.auto}}</div><div class="label">自动检测</div></div>
      </div>

      <div style="margin-bottom:16px">
        <button class="btn-sm primary" @click="showGroupModal=true">管理分组</button>
      </div>

      <div class="group-section" v-for="g in filteredGroups" :key="g.id">
        <div class="group-header">
          <span class="group-dot" :style="{background:g.color}"></span>
          <span class="group-name">{{g.name}}</span>
          <span class="group-count">{{g.services.length}} 个服务</span>
          <div class="group-actions" v-if="g.id!=='ungrouped'">
            <button @click="deleteGroup(g.id)" title="删除分组" v-if="g.services.length===0">删除</button>
          </div>
        </div>
        <div class="svc-grid">
          <div class="svc-card" v-for="s in g.services" :key="s.serviceKey">
            <div class="svc-card-top">
              <div class="svc-name">
                <span class="status-dot" :class="effectiveStatus(s)"></span>
                {{s.name}}
              </div>
              <span class="svc-badge"
                :class="effectiveStatus(s)==='server_offline' ? 'srv-offline' : s.origin">
                {{effectiveStatus(s)==='server_offline' ? '服务器离线' : s.origin==='manual' ? '手动配置' : '自动检测'}}
              </span>
            </div>
            <div class="svc-desc">{{s.desc || s.description || ''}}</div>
            <div class="svc-tags" v-if="s.tags && s.tags.length">
              <span class="svc-tag" v-for="t in s.tags" :key="t">{{t}}</span>
            </div>
            <div class="svc-server-info" v-if="s.origin==='auto'">
              <svg width="12" height="12"><use href="#fa-server"/></svg>
              {{s.serverName}} ({{s.serverHost}})
              <span v-if="s.containerName" style="margin-left:6px">| {{s.containerName}}</span>
            </div>
            <div class="svc-url" v-if="s.fullUrl">
              <a :href="s.fullUrl" target="_blank" rel="noopener">{{s.fullUrl}}</a>
            </div>
            <div class="svc-auth" v-if="s.username">
              <div class="auth-item"><span class="auth-label">账号:</span><span class="auth-val" @click="copyText(s.username)">{{s.username}}</span></div>
              <div class="auth-item"><span class="auth-label">密码:</span><span class="auth-val hidden" @click="copyText(s.password)" title="点击复制">{{s.password}}</span></div>
            </div>
            <div class="svc-footer">
              <a v-if="s.fullUrl" :href="s.fullUrl" target="_blank" rel="noopener" class="btn-sm primary">打开服务</a>
              <button v-if="s.username" class="btn-sm" @click="copyText(s.username)">复制账号</button>
              <button v-if="s.password" class="btn-sm" @click="copyText(s.password)">复制密码</button>
              <select class="svc-move-select" :value="groupConfig.serviceGroupMap[s.serviceKey] || ''" @change="moveServiceToGroup(s.serviceKey, $event.target.value)">
                <option value="">-- 移动到分组 --</option>
                <option v-for="og in groupConfig.groups.filter(g=>g.id!=='ungrouped')" :key="og.id" :value="og.id">{{og.name}}</option>
                <option value="ungrouped">未分组</option>
              </select>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== MONITOR PAGE ===== -->
    <div class="content" v-if="currentPage==='monitor'">
      <div class="monitor-select">
        <select v-model="currentServerId"><option v-for="s in servers" :key="s.id" :value="s.id">{{s.name}} ({{s.host}})</option></select>
        <button class="btn-sm" @click="loadMonitor">手动刷新</button>
        <span v-if="monitorData" style="font-size:12px;color:var(--text2);margin-left:8px">
          <span style="width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;margin-right:4px"></span>实时数据
        </span>
      </div>

      <!-- Server info bar -->
      <div class="monitor-info-bar" v-if="monitorData">
        <span>⏱ 运行: {{formatUptime(getMetric('uptime'))}}</span>
        <span>🖥 CPU核: {{getMetric('cpu_count') || '-'}}</span>
        <span>💾 内存: {{formatBytes(getMetric('memory_used'))}} / {{formatBytes(getMetric('memory_total'))}}</span>
        <span>💿 磁盘: {{formatBytes(getMetric('disk_used'))}} / {{formatBytes(getMetric('disk_total'))}}</span>
        <span>🔄 Swap: {{formatBytes(getMetric('swap_used'))}} / {{formatBytes(getMetric('swap_total'))}}</span>
        <span>📦 容器: {{getMetric('container_running')||0}} 运行 / {{getMetric('container_stopped')||0}} 停止</span>
      </div>

      <!-- Metric Cards -->
      <div class="metric-grid">
        <div v-for="mc in metricCards" :key="mc.key" class="metric-card" :class="{active:selectedMetric===mc.key}" @click="selectedMetric=mc.key;loadHistory()">
          <div class="mc-icon">{{mc.icon}}</div>
          <div class="mc-label">{{mc.label}}</div>
          <div class="mc-value" :style="{color:mc.value>90?'var(--red)':mc.value>80?'var(--orange)':mc.color}">{{mc.display}}</div>
          <div class="mc-bar"><div class="mc-bar-fill" :style="{width:Math.min(mc.value,100)+'%',background:mc.value>90?'var(--red)':mc.value>80?'var(--orange)':mc.color}"></div></div>
          <div class="mc-detail">{{mc.detail}}</div>
        </div>
      </div>

      <!-- History Chart -->
      <div class="chart-section">
        <div class="chart-header">
          <span class="ch-title">历史趋势</span>
          <div class="chart-metric-tabs">
            <button v-for="mt in [{k:'cpu',l:'CPU'},{k:'memory',l:'内存'},{k:'disk',l:'磁盘'},{k:'net_rx',l:'网络入'},{k:'net_tx',l:'网络出'},{k:'load1',l:'负载'},{k:'disk_read',l:'磁盘读'},{k:'disk_write',l:'磁盘写'}]" :key="mt.k"
              :class="{active:selectedMetric===mt.k}" @click="selectedMetric=mt.k;loadHistory()">{{mt.l}}</button>
          </div>
          <div class="chart-time-tabs">
            <button v-for="tr in [{h:1,l:'1h'},{h:3,l:'3h'},{h:6,l:'6h'},{h:12,l:'12h'},{h:24,l:'24h'},{h:72,l:'3天'},{h:168,l:'7天'}]" :key="tr.h"
              :class="{active:historyHours===tr.h}" @click="historyHours=tr.h;loadHistory()">{{tr.l}}</button>
          </div>
        </div>
        <div ref="chartBox" class="chart-container"></div>
      </div>

      <!-- Containers Table -->
      <div class="container-table">

          </tr></tbody>
        </table>
      </div>
    </div>

    <!-- ===== TOOLS PAGE ===== -->
    <div class="content" v-if="currentPage==='tools'">
      <div class="terminal-box" ref="termBox"><div v-for="(l,i) in termLines" :key="i">{{l}}</div></div>
      <div class="terminal-input-row">
        <input v-model="termInput" @keyup.enter="execCmd" placeholder="输入命令...">
        <button class="btn-sm primary" @click="execCmd">执行</button>
      </div>
      <div style="margin-top:16px">
        <div style="display:flex;gap:6px;margin-bottom:10px">
          <button v-for="(cmds,cat) in cmdTemplates" :key="cat" class="btn-sm" :class="{primary:activeCmdGroup===cat}" @click="activeCmdGroup=cat">{{cat}}</button>

        <div style="display:flex;flex-wrap:wrap;gap:6px">

        </div>

    </div>

    <!-- ===== RESOURCES PAGE ===== -->
    <div class="content" v-if="currentPage==='resources'">

          <div class="s-host">{{srv.host}} · {{srv.status}}</div>
          <div class="srv-btn-row">

        </div>
      </div>
    </div>

    <!-- ===== Group Management Modal ===== -->
    <div class="modal-overlay" v-if="showGroupModal" @click.self="showGroupModal=false">
      <div class="modal">
        <h3>分组管理</h3>
        <div v-for="g in groupConfig.groups" :key="g.id" class="group-list-item">
          <span class="g-dot" :style="{background:g.color}"></span>
          <span class="g-name">{{g.name}}</span>
          <span class="g-order">排序: {{g.order}}</span>
          <div class="g-btns">
            <button class="btn-sm danger" @click="deleteGroup(g.id)" v-if="g.id!=='ungrouped'">删除</button>
          </div>
        </div>
        <div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border)">
          <div style="font-size:13px;font-weight:500;margin-bottom:8px">新增分组</div>
          <div class="modal-row"><label>ID</label><input v-model="newGroupId" placeholder="英文标识如 cicd"></div>
          <div class="modal-row"><label>名称</label><input v-model="newGroupName" placeholder="如: 代码与CI/CD"></div>
          <div class="modal-row"><label>颜色</label><input type="color" v-model="newGroupColor"></div>
          <div style="text-align:right"><button class="btn-sm primary" @click="addGroup">添加</button></div>
        </div>
        <div class="modal-footer">
          <button class="btn-sm" @click="showGroupModal=false">关闭</button>
        </div>
      </div>
    </div>

  </div>
</div>
`
}).mount('#app');
</script>
</body>
</html>
