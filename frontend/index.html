<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>OpsCenter v4.0</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f172a;--bg2:#1e293b;--bg3:#334155;--fg:#e2e8f0;--fg2:#94a3b8;
  --accent:#38bdf8;--green:#22c55e;--orange:#f97316;--red:#ef4444;--yellow:#eab308;
  --radius:8px;--shadow:0 2px 8px rgba(0,0,0,.3);
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--fg)}
#app{display:flex;height:100%}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:3px}

/* Sidebar */
.sidebar{width:220px;min-width:220px;background:var(--bg2);display:flex;flex-direction:column;border-right:1px solid var(--bg3);overflow:hidden}
.sidebar-brand{padding:20px 16px;border-bottom:1px solid var(--bg3);display:flex;align-items:center;gap:10px}
.sidebar-brand h1{font-size:18px;font-weight:700;color:var(--accent)}
.sidebar-brand .badge{font-size:10px;background:var(--accent);color:var(--bg);padding:2px 6px;border-radius:10px;font-weight:600}
.sidebar-nav{flex:1;padding:12px 0;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;color:var(--fg2);transition:all .2s;font-size:14px;border-left:3px solid transparent}
.nav-item:hover{background:rgba(56,189,248,.08);color:var(--fg)}
.nav-item.active{background:rgba(56,189,248,.12);color:var(--accent);border-left-color:var(--accent)}
.nav-item i{width:18px;text-align:center}
.sidebar-servers{border-top:1px solid var(--bg3);padding:12px 16px;max-height:260px;overflow-y:auto}
.sidebar-servers h3{font-size:11px;text-transform:uppercase;color:var(--fg2);margin-bottom:8px;letter-spacing:1px}
.sidebar-srv{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px;color:var(--fg2);cursor:pointer;transition:color .2s}
.sidebar-srv:hover{color:var(--fg)}
.status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.status-dot.online,.status-dot.up{background:var(--green)}
.status-dot.offline,.status-dot.down{background:var(--red)}
.status-dot.warning{background:var(--orange)}
.status-dot.unknown{background:#64748b}
.status-dot.running{background:var(--green)}
.status-dot.exited{background:var(--red)}

/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--bg3);background:var(--bg2);min-height:56px}
.topbar h2{font-size:18px;font-weight:600}
.topbar-actions{display:flex;align-items:center;gap:12px}
.content{flex:1;overflow-y:auto;padding:24px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:none;border-radius:var(--radius);font-size:13px;cursor:pointer;transition:all .2s;font-family:inherit}
.btn-primary{background:var(--accent);color:var(--bg)}
.btn-primary:hover{filter:brightness(1.1)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{filter:brightness(1.1)}
.btn-ghost{background:transparent;color:var(--fg2);border:1px solid var(--bg3)}
.btn-ghost:hover{border-color:var(--fg2);color:var(--fg)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Cards */
.card{background:var(--bg2);border:1px solid var(--bg3);border-radius:var(--radius);padding:16px;transition:all .2s}
.card:hover{border-color:rgba(56,189,248,.3)}

/* Service Card */
.srv-card{cursor:pointer;position:relative;display:flex;flex-direction:column;gap:6px}
.srv-card .srv-head{display:flex;align-items:center;gap:8px}
.srv-card .srv-icon{width:32px;height:32px;border-radius:6px;background:var(--bg3);display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:14px}
.srv-card .srv-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srv-card .srv-pin{position:absolute;top:8px;right:8px;color:var(--yellow);font-size:11px}
.srv-card .srv-cat{font-size:11px;color:var(--fg2)}
.srv-card .srv-desc{font-size:12px;color:var(--fg2);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Group */
.group-header{display:flex;align-items:center;gap:10px;padding:12px 0;cursor:pointer;user-select:none}
.group-header h3{font-size:15px;font-weight:600;color:var(--fg)}
.group-header .count{font-size:12px;color:var(--fg2);background:var(--bg3);padding:2px 8px;border-radius:10px}
.group-header .chevron{color:var(--fg2);transition:transform .2s;font-size:12px}
.group-header .chevron.open{transform:rotate(90deg)}

/* Server Card */
.server-card .sc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.server-card .sc-name{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.server-card .sc-host{font-size:12px;color:var(--fg2);margin-bottom:10px}
.server-card .sc-metrics{display:flex;gap:12px;margin-bottom:12px}
.server-card .sc-metric{text-align:center;flex:1}
.server-card .sc-metric .val{font-size:18px;font-weight:700}
.server-card .sc-metric .label{font-size:11px;color:var(--fg2)}
.server-card .sc-actions{display:flex;gap:6px;flex-wrap:wrap}
.server-card .sc-info{font-size:12px;color:var(--fg2);margin-top:8px;line-height:1.6}

/* Grid */
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:1200px){.grid-4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.grid-3,.grid-4{grid-template-columns:1fr}.grid-2{grid-template-columns:1fr}}

/* Search */
.search-box{position:relative}
.search-box input{width:100%;padding:8px 12px 8px 36px;background:var(--bg);border:1px solid var(--bg3);border-radius:var(--radius);color:var(--fg);font-size:13px;outline:none;transition:border-color .2s}
.search-box input:focus{border-color:var(--accent)}
.search-box i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--fg2);font-size:13px}

/* Modal */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal{background:var(--bg2);border:1px solid var(--bg3);border-radius:12px;padding:24px;width:460px;max-width:90vw;max-height:80vh;overflow-y:auto}
.modal h3{font-size:16px;font-weight:600;margin-bottom:16px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;color:var(--fg2);margin-bottom:4px}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--bg3);border-radius:var(--radius);color:var(--fg);font-size:13px;outline:none;font-family:inherit}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--accent)}
.form-group textarea{resize:vertical;min-height:60px}
.form-group select{cursor:pointer}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}

/* Gauge */
.gauge-card{text-align:center;padding:20px}
.gauge-card .gauge-label{font-size:13px;color:var(--fg2);margin-bottom:6px}
.gauge-card .gauge-val{font-size:36px;font-weight:700;line-height:1}
.gauge-card .gauge-sub{font-size:12px;color:var(--fg2);margin-top:4px}

/* Tabs */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--bg3);margin-bottom:20px}
.tab{padding:10px 20px;cursor:pointer;color:var(--fg2);font-size:13px;border-bottom:2px solid transparent;transition:all .2s}
.tab:hover{color:var(--fg)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* Table */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;color:var(--fg2);font-weight:600;border-bottom:1px solid var(--bg3);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
td{padding:10px 12px;border-bottom:1px solid rgba(51,65,85,.5)}
tr:hover td{background:rgba(56,189,248,.04)}

/* Toast */
.toast-container{position:fixed;top:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 20px;border-radius:var(--radius);color:#fff;font-size:13px;animation:slideIn .3s;min-width:200px;box-shadow:var(--shadow)}
.toast.success{background:var(--green)}
.toast.error{background:var(--red)}
.toast.info{background:var(--accent)}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}

/* Discovery */
.discovery-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid rgba(51,65,85,.5)}
.discovery-row:last-child{border-bottom:none}
.discovery-info{display:flex;align-items:center;gap:12px}
.discovery-detail{font-size:12px;color:var(--fg2)}
.discovery-sources{display:flex;gap:6px;margin-top:4px}
.discovery-source{font-size:11px;background:var(--bg3);padding:2px 8px;border-radius:10px;color:var(--fg2)}

/* Spinner */
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Empty */
.empty{text-align:center;padding:40px;color:var(--fg2)}
.empty i{font-size:32px;margin-bottom:12px;display:block;opacity:.4}

.chart-box{width:100%;height:300px;margin-bottom:16px}
</style>
</head>
<body>
<div id="app">
  <!-- Toast -->
  <div class="toast-container">
    <div v-for="t in toasts" :key="t.id" :class="['toast',t.type]">{{t.msg}}</div>
  </div>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <h1>OpsCenter</h1>
      <span class="badge">v4.0</span>
    </div>
    <nav class="sidebar-nav">
      <div v-for="n in navItems" :key="n.key" :class="['nav-item',{active:page===n.key}]" @click="page=n.key">
        <i :class="'fa-solid '+n.icon"></i><span>{{n.label}}</span>
      </div>
    </nav>
    <div class="sidebar-servers">
      <h3>Servers</h3>
      <div v-for="s in allServers" :key="s.id" class="sidebar-srv" @click="selectServer(s.id)">
        <span :class="['status-dot',s.status]"></span>
        <span>{{s.name}}</span>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <header class="topbar">
      <h2>{{pageTitle}}</h2>
      <div class="topbar-actions">
        <select v-if="page==='monitor'" v-model="monitorServerId" @change="loadMonitor" style="padding:6px 12px;background:var(--bg);border:1px solid var(--bg3);border-radius:var(--radius);color:var(--fg);font-size:13px">
          <option value="">Select Server</option>
          <option v-for="s in allServers" :key="s.id" :value="s.id">{{s.name}}</option>
        </select>
        <button v-if="page==='servers'" class="btn btn-primary" @click="openAddServer"><i class="fa-solid fa-plus"></i> Add Server</button>
        <button v-if="page==='discovery'" class="btn btn-primary" @click="runDiscoveryAll" :disabled="discoveryRunning"><i class="fa-solid fa-play"></i> Run All</button>
      </div>
    </header>
    <div class="content">

      <!-- PAGE: Nav -->
      <template v-if="page==='nav'">
        <div style="max-width:400px;margin-bottom:20px">
          <div class="search-box">
            <i class="fa-solid fa-search"></i>
            <input v-model="navSearch" placeholder="Search services...">
          </div>
        </div>
        <div v-for="g in filteredGroups" :key="g.id||'ungrouped'" style="margin-bottom:8px">
          <div class="group-header" @click="toggleGroup(g.id||'ungrouped')">
            <i :class="['fa-solid fa-chevron-right chevron',{open:openGroups[g.id||'ungrouped']}]"></i>
            <h3>{{g.name||'未分组'}}</h3>
            <span class="count">{{g.services.length}}</span>
          </div>
          <div v-show="openGroups[g.id||'ungrouped']" class="grid-3" style="padding-bottom:12px">
            <div v-for="s in g.services" :key="s.id" class="card srv-card" @click="openServiceUrl(s)">
              <span v-if="s.pinned" class="srv-pin"><i class="fa-solid fa-thumbtack"></i></span>
              <div class="srv-head">
                <div class="srv-icon"><i :class="getServiceIcon(s)"></i></div>
                <div>
                  <div class="srv-name">{{s.name}}</div>
                  <span :class="['status-dot',s.status]" style="display:inline-block;vertical-align:middle"></span>
                  <span class="srv-cat">{{s.category}}</span>
                </div>
              </div>
              <div v-if="s.description" class="srv-desc">{{s.description}}</div>
            </div>
          </div>
        </div>
        <div v-if="!filteredGroups.length" class="empty"><i class="fa-solid fa-compass"></i>No services found</div>
      </template>

      <!-- PAGE: Servers -->
      <template v-if="page==='servers'">
        <div class="grid-2">
          <div v-for="s in allServers" :key="s.id" class="card server-card">
            <div class="sc-head">
              <div class="sc-name"><span :class="['status-dot',s.status]"></span>{{s.name}}</div>
              <span style="font-size:12px;padding:3px 8px;border-radius:10px;font-weight:600" :style="{background:s.status==='online'?'rgba(34,197,94,.15)':s.status==='warning'?'rgba(249,115,22,.15)':s.status==='offline'?'rgba(239,68,68,.15)':'rgba(100,116,139,.15)',color:s.status==='online'?'var(--green)':s.status==='warning'?'var(--orange)':s.status==='offline'?'var(--red)':'var(--fg2)'}">{{s.status}}</span>
            </div>
            <div class="sc-host"><i class="fa-solid fa-network-wired" style="margin-right:4px"></i>{{s.host}}:{{s.ssh_port||22}}</div>
            <div class="sc-metrics" v-if="s.metrics">
              <div class="sc-metric"><div class="val" :style="{color:pctColor(s.metrics.cpu_percent)}">{{fmtPct(s.metrics.cpu_percent)}}</div><div class="label">CPU</div></div>
              <div class="sc-metric"><div class="val" :style="{color:pctColor(s.metrics.memory_percent)}">{{fmtPct(s.metrics.memory_percent)}}</div><div class="label">Memory</div></div>
              <div class="sc-metric"><div class="val" :style="{color:pctColor(s.metrics.disk_percent)}">{{fmtPct(s.metrics.disk_percent)}}</div><div class="label">Disk</div></div>
            </div>
            <div v-if="s.service_count!=null" style="font-size:12px;color:var(--fg2);margin-bottom:10px"><i class="fa-solid fa-cube" style="margin-right:4px"></i>{{s.service_count}} services</div>
            <div v-if="s.status==='offline'" class="sc-info">
              <div v-if="s.fail_count">Fail count: {{s.fail_count}}</div>
              <div v-if="s.last_error" style="color:var(--red)">Error: {{s.last_error}}</div>
              <div v-if="s.last_online_at">Last online: {{s.last_online_at}}</div>
            </div>
            <div class="sc-actions">
              <button class="btn btn-ghost btn-sm" @click="checkServer(s.id)" :disabled="s._checking"><span v-if="s._checking" class="spinner"></span><i v-else class="fa-solid fa-plug"></i> Check</button>
              <button class="btn btn-ghost btn-sm" @click="scanServer(s.id)" :disabled="s._scanning"><span v-if="s._scanning" class="spinner"></span><i v-else class="fa-solid fa-radar"></i> Scan</button>
              <button class="btn btn-ghost btn-sm" @click="openEditServer(s)"><i class="fa-solid fa-pen"></i></button>
              <button class="btn btn-danger btn-sm" @click="deleteServer(s.id)"><i class="fa-solid fa-trash"></i></button>
              <button v-if="s.status!=='offline'" class="btn btn-ghost btn-sm" @click="toggleServer(s.id,false)"><i class="fa-solid fa-power-off"></i></button>
              <button v-else class="btn btn-primary btn-sm" @click="toggleServer(s.id,true)"><i class="fa-solid fa-power-off"></i></button>
            </div>
          </div>
        </div>
        <div v-if="!allServers.length" class="empty"><i class="fa-solid fa-server"></i>No servers configured</div>
      </template>

      <!-- PAGE: Discovery -->
      <template v-if="page==='discovery'">
        <div class="card" style="margin-bottom:20px">
          <div style="display:flex;align-items:center;justify-content:space-between">
            <div>
              <h3 style="font-size:14px;font-weight:600;margin-bottom:4px">Service Auto-Discovery</h3>
              <span style="font-size:12px;color:var(--fg2)">{{discoveryStatus?.status==='running'?'Discovery in progress...':discoveryStatus?.last_run?'Last run: '+discoveryStatus.last_run:'No discovery run yet'}}</span>
            </div>
          </div>
        </div>
        <div class="card">
          <div v-for="s in allServers" :key="s.id" class="discovery-row">
            <div class="discovery-info">
              <span :class="['status-dot',s.status]"></span>
              <div>
                <div style="font-size:14px;font-weight:600">{{s.name}}</div>
                <div class="discovery-detail">{{s.service_count||0}} services</div>
                <div class="discovery-sources">
                  <span class="discovery-source">Docker</span>
                  <span class="discovery-source">Port</span>
                  <span class="discovery-source">Prometheus</span>
                  <span class="discovery-source">Nginx</span>
                </div>
              </div>
            </div>
            <button class="btn btn-ghost btn-sm" @click="runDiscovery(s.id)" :disabled="discoveryRunning"><i class="fa-solid fa-play"></i> Run</button>
          </div>
          <div v-if="!allServers.length" class="empty"><i class="fa-solid fa-magnifying-glass"></i>No servers to discover</div>
        </div>
      </template>

      <!-- PAGE: Monitor -->
      <template v-if="page==='monitor'">
        <div v-if="!monitorServerId" class="empty"><i class="fa-solid fa-chart-line"></i>Select a server to view metrics</div>
        <template v-else>
          <div class="grid-4" style="margin-bottom:20px">
            <div class="card gauge-card">
              <div class="gauge-label">CPU</div>
              <div class="gauge-val" :style="{color:pctColor(monitorData?.cpu_percent)}">{{fmtPct(monitorData?.cpu_percent)}}</div>
              <div class="gauge-sub" v-if="monitorData">{{monitorData.cpu_count||''}} cores</div>
            </div>
            <div class="card gauge-card">
              <div class="gauge-label">Memory</div>
              <div class="gauge-val" :style="{color:pctColor(monitorData?.memory_percent)}">{{fmtPct(monitorData?.memory_percent)}}</div>
              <div class="gauge-sub" v-if="monitorData">{{fmtBytes(monitorData.memory_used)}} / {{fmtBytes(monitorData.memory_total)}}</div>
            </div>
            <div class="card gauge-card">
              <div class="gauge-label">Disk</div>
              <div class="gauge-val" :style="{color:pctColor(monitorData?.disk_percent)}">{{fmtPct(monitorData?.disk_percent)}}</div>
              <div class="gauge-sub" v-if="monitorData">{{fmtBytes(monitorData.disk_used)}} / {{fmtBytes(monitorData.disk_total)}}</div>
            </div>
            <div class="card gauge-card">
              <div class="gauge-label">Load Avg</div>
              <div class="gauge-val" style="color:var(--accent)">{{monitorData?.load_1min?.toFixed(2)||'-'}}</div>
              <div class="gauge-sub" v-if="monitorData">{{monitorData.load_5min?.toFixed(2)}} / {{monitorData.load_15min?.toFixed(2)}}</div>
            </div>
          </div>
          <div class="tabs">
            <div :class="['tab',{active:monitorTab==='charts'}]" @click="monitorTab='charts'">趋势图</div>
            <div :class="['tab',{active:monitorTab==='containers'}]" @click="monitorTab='containers';loadContainers()">容器列表</div>
            <div :class="['tab',{active:monitorTab==='disks'}]" @click="monitorTab='disks';loadDisks()">磁盘详情</div>
          </div>
          <!-- Charts Tab -->
          <div v-if="monitorTab==='charts'">
            <div style="display:flex;gap:8px;margin-bottom:16px">
              <button v-for="m in chartMetrics" :key="m.key" :class="['btn','btn-sm',chartMetric===m.key?'btn-primary':'btn-ghost']" @click="chartMetric=m.key;loadHistory()">{{m.label}}</button>
            </div>
            <div ref="chartEl" class="chart-box"></div>
          </div>
          <!-- Containers Tab -->
          <div v-if="monitorTab==='containers'">
            <div class="table-wrap">
              <table>
                <thead><tr><th>Name</th><th>Image</th><th>Status</th><th>Ports</th></tr></thead>
                <tbody>
                  <tr v-for="c in containers" :key="c.name||c.id">
                    <td><span :class="['status-dot',c.status==='running'?'running':'exited']" style="display:inline-block;vertical-align:middle;margin-right:6px"></span>{{c.name}}</td>
                    <td style="color:var(--fg2)">{{c.image}}</td>
                    <td><span :style="{color:c.status==='running'?'var(--green)':'var(--red)'}">{{c.status}}</span></td>
                    <td style="color:var(--fg2)">{{c.ports||'-'}}</td>
                  </tr>
                  <tr v-if="!containers.length"><td colspan="4" style="text-align:center;color:var(--fg2);padding:20px">No containers</td></tr>
                </tbody>
              </table>
            </div>
          </div>
          <!-- Disks Tab -->
          <div v-if="monitorTab==='disks'">
            <div class="table-wrap">
              <table>
                <thead><tr><th>Mount</th><th>Device</th><th>Total</th><th>Used</th><th>Avail</th><th>Use%</th></tr></thead>
                <tbody>
                  <tr v-for="d in disks" :key="d.mountpoint||d.device">
                    <td>{{d.mountpoint}}</td>
                    <td style="color:var(--fg2)">{{d.device}}</td>
                    <td>{{fmtBytes(d.size||d.total)}}</td>
                    <td>{{fmtBytes(d.used)}}</td>
                    <td>{{fmtBytes(d.avail)}}</td>
                    <td :style="{color:pctColor(d.percent||d.use_percent)}">{{(d.percent||d.use_percent||0)}}%</td>
                  </tr>
                  <tr v-if="!disks.length"><td colspan="6" style="text-align:center;color:var(--fg2);padding:20px">No disk data</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </template>
      </template>

    </div>
  </div>

  <!-- Add/Edit Server Modal -->
  <div v-if="showServerModal" class="modal-mask" @click.self="showServerModal=false">
    <div class="modal">
      <h3>{{editingServer?'Edit Server':'Add Server'}}</h3>
      <div class="form-group"><label>Name</label><input v-model="serverForm.name" placeholder="My Server"></div>
      <div class="form-group"><label>Host / IP</label><input v-model="serverForm.host" placeholder="192.168.1.1"></div>
      <div class="form-group"><label>SSH Port</label><input v-model.number="serverForm.ssh_port" type="number" placeholder="22"></div>
      <div class="form-group"><label>SSH User</label><input v-model="serverForm.ssh_user" placeholder="root"></div>
      <div class="form-group"><label>Auth Type</label><select v-model="serverForm.auth_type"><option value="password">Password</option><option value="key">SSH Key</option></select></div>
      <div class="form-group" v-if="serverForm.auth_type==='password'"><label>SSH Password</label><input v-model="serverForm.ssh_password" type="password"></div>
      <div class="form-group" v-if="serverForm.auth_type==='key'"><label>SSH Private Key</label><textarea v-model="serverForm.ssh_key" rows="3" placeholder="-----BEGIN OPENSSH PRIVATE KEY-----"></textarea></div>
      <div class="form-group"><label>Tags (comma separated)</label><input v-model="serverForm.tags_str" placeholder="production,web"></div>
      <div class="form-group"><label>Remark</label><textarea v-model="serverForm.remark" rows="2"></textarea></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" @click="showServerModal=false">Cancel</button>
        <button class="btn btn-primary" @click="saveServer" :disabled="!serverForm.name||!serverForm.host">{{editingServer?'Update':'Create'}}</button>
      </div>
    </div>
  </div>
</div>

<script>
const {createApp,ref,reactive,computed,watch,onMounted,onUnmounted,nextTick}=Vue
const API='/ops/api/v2'

createApp({
  setup(){
    const page=ref('nav')
    const navItems=[
      {key:'nav',label:'Nav',icon:'fa-compass'},
      {key:'servers',label:'Servers',icon:'fa-server'},
      {key:'discovery',label:'Discovery',icon:'fa-magnifying-glass'},
      {key:'monitor',label:'Monitor',icon:'fa-chart-line'},
    ]
    const pageTitle=computed(()=>navItems.find(n=>n.key===page.value)?.label||'')
    const toasts=ref([])
    let toastId=0
    function toast(msg,type='info'){toasts.value.push({id:++toastId,msg,type});setTimeout(()=>{toasts.value=toasts.value.filter(t=>t.id!==toastId)},3000)}

    // Data
    const allServers=ref([])
    const homeData=ref(null)
    const groupConfig=ref([])
    const categories=ref([])
    const navSearch=ref('')
    const openGroups=reactive({})

    // Load
    async function api(path,opts={}){
      const r=await fetch(API+path,opts)
      if(!r.ok)throw new Error(`${r.status} ${r.statusText}`)
      return r.json()
    }

    async function loadServers(){
      try{const d=await api('/servers');allServers.value=d.map(s=>({...s,_checking:false,_scanning:false}))}catch(e){console.error(e)}
    }
    async function loadHome(){
      try{homeData.value=await api('/home')}catch(e){console.error(e)}
    }
    async function loadGroupConfig(){
      try{groupConfig.value=await api('/group-config')}catch(e){console.error(e)}
    }
    async function loadCategories(){
      try{categories.value=await api('/categories')}catch(e){console.error(e)}
    }

    // Nav page grouping
    const homeServices=computed(()=>{
      if(!homeData.value)return[]
      // home API returns: {servers: [{services: [...]}], stats: {...}}
      const allSvcs=[]
      const servers=homeData.value.servers||[]
      servers.forEach(srv=>{
        (srv.services||[]).forEach(svc=>{
          allSvcs.push({...svc,server_name:srv.name,server_status:srv.status})
        })
      })
      return allSvcs.sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0))
    })

    const filteredGroups=computed(()=>{
      // groupConfig: {groups: [{id,name,color,icon,order}], serviceGroupMap: {serviceKey: groupId}}
      const raw=groupConfig.value||{}
      const gArr=JSON.parse(JSON.stringify(raw.groups||[]))
      const svcMap=raw.serviceGroupMap||{}
      gArr.forEach(g=>g.services=[])
      const ungrouped={id:null,name:'未分组',services:[]}
      const q=navSearch.value.toLowerCase()
      homeServices.value.forEach(s=>{
        if(q&&!s.name.toLowerCase().includes(q)&&!(s.description||'').toLowerCase().includes(q))return
        // Match by container_name or name as key
        const sKey=s.container_name||s.name
        const gid=svcMap[sKey]||svcMap[s.id]
        if(gid){const g=gArr.find(g2=>g2.id===gid);if(g)g.services.push(s);else ungrouped.services.push(s)}
        else ungrouped.services.push(s)
      })
      const result=gArr.filter(g=>g.services.length>0)
      if(ungrouped.services.length>0)result.push(ungrouped)
      result.forEach(g=>{if(openGroups[g.id||'ungrouped']===undefined)openGroups[g.id||'ungrouped']=true})
      return result
    })
    function toggleGroup(key){openGroups[key]=!openGroups[key]}

    function getServiceIcon(s){
      if(s.icon)return 'fa-solid '+s.icon
      const catIcons={'代码与CI/CD':'fa-code','应用服务':'fa-cube','监控与日志':'fa-chart-area','网络与代理':'fa-network-wired','数据存储':'fa-database','安全':'fa-shield-halved','运维管理':'fa-gauge-high','未分类':'fa-cube'}
      return 'fa-solid '+(catIcons[s.category]||'fa-cube')
    }
    function openServiceUrl(s){
      if(s.url)window.open(s.url,'_blank')
    }

    // Servers page
    const showServerModal=ref(false)
    const editingServer=ref(null)
    const serverForm=reactive({name:'',host:'',ssh_port:22,ssh_user:'root',auth_type:'password',ssh_password:'',ssh_key:'',tags_str:'',remark:''})

    function openAddServer(){
      editingServer.value=null
      Object.assign(serverForm,{name:'',host:'',ssh_port:22,ssh_user:'root',auth_type:'password',ssh_password:'',ssh_key:'',tags_str:'',remark:''})
      showServerModal.value=true
    }
    function openEditServer(s){
      editingServer.value=s
      Object.assign(serverForm,{name:s.name,host:s.host,ssh_port:s.ssh_port||22,ssh_user:s.ssh_user||'root',auth_type:s.auth_type||'password',ssh_password:'',ssh_key:'',tags_str:(s.tags||[]).join(', '),remark:s.remark||''})
      showServerModal.value=true
    }
    async function saveServer(){
      const body={name:serverForm.name,host:serverForm.host,ssh_port:serverForm.ssh_port,ssh_user:serverForm.ssh_user,auth_type:serverForm.auth_type,ssh_password:serverForm.ssh_password,ssh_key:serverForm.ssh_key,tags:serverForm.tags_str.split(',').map(t=>t.trim()).filter(Boolean),remark:serverForm.remark}
      try{
        if(editingServer.value){await api(`/servers/${editingServer.value.id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});toast('Server updated','success')}
        else{await api('/servers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});toast('Server created','success')}
        showServerModal.value=false;loadServers()
      }catch(e){toast('Error: '+e.message,'error')}
    }
    async function deleteServer(id){
      if(!confirm('Delete this server?'))return
      try{await api(`/servers/${id}`,{method:'DELETE'});toast('Server deleted','success');loadServers()}catch(e){toast('Error: '+e.message,'error')}
    }
    async function checkServer(id){
      const s=allServers.value.find(x=>x.id===id);if(!s)return;s._checking=true
      try{const r=await api(`/servers/${id}/check`,{method:'POST'});toast(r.reachable?'Server online':'Server offline',r.reachable?'success':'error');loadServers()}catch(e){toast('Check failed','error')}finally{s._checking=false}
    }
    async function scanServer(id){
      const s=allServers.value.find(x=>x.id===id);if(!s)return;s._scanning=true
      try{const r=await api(`/servers/${id}/scan`,{method:'POST'});toast(`Found ${r.discovered||0} services`,'success');loadServers();loadHome()}catch(e){toast('Scan failed','error')}finally{s._scanning=false}
    }
    async function toggleServer(id,enable){
      try{await api(`/servers/${id}/${enable?'enable':'disable'}`,{method:'POST'});toast(enable?'Server enabled':'Server disabled','success');loadServers();loadHome()}catch(e){toast('Error: '+e.message,'error')}
    }

    // Discovery
    const discoveryStatus=ref(null)
    const discoveryRunning=ref(false)
    async function loadDiscoveryStatus(){try{discoveryStatus.value=await api('/discovery/status')}catch(e){}}
    async function runDiscovery(serverId){
      discoveryRunning.value=true
      try{await api('/discovery/run'+(serverId?`?server_id=${serverId}`:''),{method:'POST'});toast('Discovery started','success');loadServers();loadHome();loadDiscoveryStatus()}catch(e){toast('Error: '+e.message,'error')}finally{discoveryRunning.value=false}
    }
    async function runDiscoveryAll(){await runDiscovery(null)}

    // Monitor
    const monitorServerId=ref('')
    const monitorData=ref(null)
    const monitorTab=ref('charts')
    const containers=ref([])
    const disks=ref([])
    const chartMetrics=[{key:'cpu',label:'CPU'},{key:'memory',label:'Memory'},{key:'disk',label:'Disk'},{key:'network',label:'Network'}]
    const chartMetric=ref('cpu')
    const chartEl=ref(null)
    let chartInstance=null
    let monitorTimer=null

    async function loadMonitor(){
      if(!monitorServerId.value){monitorData.value=null;return}
      try{
        const d=await api(`/monitor/${monitorServerId.value}`)
        const m=d.metrics||{}
        // Normalize field names for template
        monitorData.value={
          cpu_percent:m.cpu, cpu_count:m.cpu_count,
          memory_percent:m.memory, memory_total:m.memory_total, memory_used:m.memory_used, memory_avail:m.memory_avail,
          disk_percent:m.disk, disk_total:m.disk_total, disk_used:m.disk_used, disk_avail:m.disk_avail,
          load_1min:m.load1, load_5min:m.load5, load_15min:m.load15,
          net_rx:m.net_rx, net_tx:m.net_tx, uptime:m.uptime,
          containers:d.containers||[],
        }
        containers.value=d.containers||[]
        if(monitorTab.value==='charts')await nextTick(),loadHistory()
      }catch(e){console.error(e)}
    }
    async function loadHistory(){
      if(!monitorServerId.value)return
      try{
        const d=await api(`/monitor/${monitorServerId.value}/history?metric=${chartMetric.value}&hours=24`)
        renderChart(d)
      }catch(e){console.error(e)}
    }
    async function loadContainers(){
      if(!monitorServerId.value)return
      try{const r=await api(`/monitor/${monitorServerId.value}/containers`);containers.value=r.containers||r||[]}catch(e){containers.value=[]}
    }
    async function loadDisks(){
      if(!monitorServerId.value)return
      try{const r=await api(`/monitor/${monitorServerId.value}/disks`);disks.value=r.disks||r||[]}catch(e){disks.value=[]}
    }

    function renderChart(data){
      if(!chartEl.value)return
      if(!chartInstance)chartInstance=echarts.init(chartEl.value)
      const values=data.values||[]
      const xData=values.map(v=>{
        const ts=Array.isArray(v)?v[0]:(v.timestamp||v.time||v.ts)
        const t=new Date(ts*1000)
        return isNaN(t)?'':t.getHours().toString().padStart(2,'0')+':'+t.getMinutes().toString().padStart(2,'0')
      })
      const yData=values.map(v=>{
        return Array.isArray(v)?parseFloat(v[1]):(v.value!=null?v.value:v)
      })
      const colorMap={cpu:'#38bdf8',memory:'#22c55e',disk:'#f97316',network:'#a78bfa'}
      const labelMap={cpu:'CPU %',memory:'Memory %',disk:'Disk %',network:'Network (B/s)'}
      chartInstance.setOption({
        tooltip:{trigger:'axis',backgroundColor:'#1e293b',borderColor:'#334155',textStyle:{color:'#e2e8f0',fontSize:12}},
        grid:{top:30,right:20,bottom:30,left:50},
        xAxis:{type:'category',data:xData,axisLine:{lineStyle:{color:'#334155'}},axisLabel:{color:'#94a3b8',fontSize:11}},
        yAxis:{type:'value',axisLine:{show:false},splitLine:{lineStyle:{color:'rgba(51,65,85,.5)'}},axisLabel:{color:'#94a3b8',fontSize:11}},
        series:[{data:yData,type:'line',smooth:true,symbol:'none',lineStyle:{width:2,color:colorMap[chartMetric.value]||'#38bdf8'},areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:(colorMap[chartMetric.value]||'#38bdf8')+'33'},{offset:1,color:'transparent'}])}}],
        title:{text:labelMap[chartMetric.value]||'',textStyle:{color:'#e2e8f0',fontSize:13,fontWeight:500},left:10,top:5}
      },true)
    }

    function selectServer(id){monitorServerId.value=id;page.value='monitor';loadMonitor()}

    // Helpers
    function pctColor(v){
      if(v==null)return 'var(--fg2)'
      if(v>90)return 'var(--red)'
      if(v>80)return 'var(--orange)'
      if(v>60)return 'var(--yellow)'
      return 'var(--green)'
    }
    function fmtPct(v){return v!=null?Math.round(v)+'%':'-'}
    function fmtBytes(b){
      if(b==null||b===0)return '0 B'
      const u=['B','KB','MB','GB','TB']
      const i=Math.floor(Math.log(Math.abs(b))/Math.log(1024))
      return (b/Math.pow(1024,i)).toFixed(1)+' '+u[i]
    }

    // Init
    onMounted(async()=>{
      await Promise.all([loadServers(),loadHome(),loadGroupConfig(),loadCategories(),loadDiscoveryStatus()])
      // Auto-select first server for monitor
      if(allServers.value.length)monitorServerId.value=allServers.value[0].id
      // Monitor auto-refresh
      monitorTimer=setInterval(()=>{if(page.value==='monitor'&&monitorServerId.value)loadMonitor()},30000)
    })
    onUnmounted(()=>{if(monitorTimer)clearInterval(monitorTimer);if(chartInstance)chartInstance.dispose()})

    // Watch chart tab & metric
    watch(monitorTab,async v=>{
      if(v==='charts')await nextTick(),loadHistory()
    })
    watch(page,async v=>{
      if(v==='monitor'&&monitorServerId.value){await nextTick();loadMonitor()}
      if(v==='discovery')loadDiscoveryStatus()
    })

    return{
      page,navItems,pageTitle,toasts,
      allServers,homeData,groupConfig,categories,
      navSearch,openGroups,filteredGroups,toggleGroup,getServiceIcon,openServiceUrl,
      showServerModal,editingServer,serverForm,openAddServer,openEditServer,saveServer,deleteServer,checkServer,scanServer,toggleServer,
      discoveryStatus,discoveryRunning,runDiscovery,runDiscoveryAll,
      monitorServerId,monitorData,monitorTab,containers,disks,
      chartMetrics,chartMetric,chartEl,loadMonitor,loadHistory,loadContainers,loadDisks,selectServer,
      pctColor,fmtPct,fmtBytes,
    }
  }
}).mount('#app')
</script>
</body>
</html>
