services:
  db:
    image: postgres:16-alpine
    container_name: opscenter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opscenter}
      POSTGRES_USER: ${POSTGRES_USER:-opscenter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_BIND_IP:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ${POSTGRES_DATA_DIR:-/opt/opscenter-data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB -Atqc 'select 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
