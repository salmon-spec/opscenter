apiVersion: batch/v1
kind: CronJob
metadata:
  name: metric-history-retention
  namespace: opscenter
  labels:
    app: opscenter-maintenance
spec:
  schedule: "20 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1500
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: metric-history-retention
        spec:
          restartPolicy: Never
          containers:
          - name: retention
            image: postgres:16-alpine
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: opscenter-env
                  key: DATABASE_URL
            command: ["/bin/sh","-c"]
            args:
            - |
              set -eu
              DBURL=$(printf '%s' "$DATABASE_URL" | sed 's/postgresql+psycopg/postgresql/')
              BATCH=20000
              TOTAL=0
              START=$(date +%s)
              echo "retention: deleting metric_history rows older than 14 days (batch=$BATCH)"
              while true; do
                NOW=$(date +%s)
                if [ $((NOW-START)) -ge 1400 ]; then
                  echo "retention budget reached: total=$TOTAL; remaining rows deferred to next run"
                  break
                fi
                DELETED=$(PGOPTIONS='-c statement_timeout=60000 -c lock_timeout=5000' psql "$DBURL" -X -q -v ON_ERROR_STOP=1 -tA -c "
                  WITH doomed AS (
                    SELECT id FROM metric_history
                    WHERE timestamp < now() - interval '14 days'
                    ORDER BY timestamp
                    LIMIT $BATCH
                  ), deleted AS (
                    DELETE FROM metric_history m USING doomed WHERE m.id = doomed.id RETURNING 1
                  ) SELECT count(*) FROM deleted;") || {
                    echo "retention failed: SQL error or timeout; total=$TOTAL" >&2
                    exit 1
                  }
                case "$DELETED" in ''|*[!0-9]*) echo "retention failed: invalid row count" >&2; exit 1;; esac
                TOTAL=$((TOTAL+DELETED))
                echo "$(date -u +%FT%TZ) batch=$DELETED total=$TOTAL"
                if [ "$DELETED" -lt "$BATCH" ]; then echo "retention complete: total=$TOTAL"; break; fi
                sleep 1
              done
            resources:
              requests: {cpu: 50m, memory: 64Mi}
              limits: {cpu: 200m, memory: 128Mi}
