spec:
  template:
    spec:
      containers:
        - name: backend
          image: opscenter/backend:no-ai-20261015
          envFrom:
            - secretRef:
                name: opscenter-env
            - configMapRef:
                name: opscenter-env-fixed
            - configMapRef:
                name: opscenter-middleware-config
            - secretRef:
                name: opscenter-middleware-secrets
          env:
            - name: OPS_AUTH_ENABLED
              value: "true"
            - name: OPS_MONITOR_ALLOW_ANONYMOUS
              value: "false"
            - name: OPS_JWT_PRIVATE_KEY_FILE
              value: /run/jwt/jwt-private.pem
            - name: OPS_JWT_PUBLIC_KEY_FILE
              value: /run/jwt/jwt-public.pem
            - name: OPS_JWT_LEGACY_UNTIL
              value: "2026-10-15T00:00:00Z"
            - name: HOST_INVENTORY_INGEST_URL
              value: http://module-host-inventory:8080/api/v1/agent/telemetry
            - name: HOST_INVENTORY_INGEST_TOKEN_FILE
              value: /run/ingest/host-inventory-ingest-token
            - name: HOST_MONITOR_INGEST_URL
              value: http://module-host-monitor:8080/api/v1/internal/samples
            - name: HOST_MONITOR_INGEST_TOKEN_FILE
              value: /run/monitor/token
            - name: ALERTING_ENABLED
              value: "false"
            - name: SERVICE_HEALTH_ENABLED
              value: "false"
            - name: OPS_COMMAND_CODE_USAGE_OWNER
              value: module
          volumeMounts:
            - name: jwt-keypair
              mountPath: /run/jwt
              readOnly: true
            - name: host-inventory-ingest
              mountPath: /run/ingest
              readOnly: true
            - name: host-monitor-ingest
              mountPath: /run/monitor/token
              subPath: token
              readOnly: true
            - name: backend-code-opt
              mountPath: /opt/opscenter/backend/app/main.py
              subPath: main.py
              readOnly: true
            - name: backend-code-opt
              mountPath: /opt/opscenter/backend/app/alerting.py
              subPath: alerting.py
              readOnly: true
            - name: backend-code-opt
              mountPath: /opt/opscenter/backend/app/ssh_host_keys.py
              subPath: ssh_host_keys.py
              readOnly: true
      volumes:
        - name: jwt-keypair
          secret:
            secretName: opscenter-jwt-keypair
        - name: host-inventory-ingest
          secret:
            secretName: opscenter-host-inventory-ingest
        - name: host-monitor-ingest
          secret:
            secretName: opscenter-host-monitor-ingest
        - name: backend-code-opt
          configMap:
            name: opscenter-backend-no-ai-20261015
