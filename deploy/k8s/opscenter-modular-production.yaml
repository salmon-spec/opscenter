apiVersion: apps/v1
kind: Deployment
metadata:
  name: module-k3s
  namespace: opscenter
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: module-k3s
  template:
    metadata:
      labels:
        app: module-k3s
    spec:
      containers:
      - name: module-k3s
        image: opscenter/module-k3s:cf2f34bb
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: MODULE_AUTH_REQUIRED
          value: 'true'
        - name: OPS_JWT_PUBLIC_KEY_FILE
          value: /run/secrets/opscenter_jwt_public
        - name: OPS_JWT_LEGACY_UNTIL
          value: '2026-10-15T00:00:00Z'
        - name: K8S_API_URL
          value: https://kubernetes.default.svc:443
        - name: K8S_TOKEN_FILE
          value: /var/run/secrets/kubernetes.io/serviceaccount/token
        - name: K8S_CA_PATH
          value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        - name: K8S_TIMEOUT_SECONDS
          value: '5'
        - name: MODULE_DATABASE_URL_FILE
          value: /run/secrets/k3s_db_url
        - name: OPS_ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: opscenter-env
              key: OPS_ADMIN_USER
        volumeMounts:
        - name: opscenter-jwt-public
          mountPath: /run/secrets/opscenter_jwt_public
          subPath: jwt-public.pem
          readOnly: true
        - name: k3s-db-url
          mountPath: /run/secrets/k3s_db_url
          subPath: k3s_db_url
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
      volumes:
      - name: opscenter-jwt-public
        secret:
          secretName: opscenter-jwt-keypair
      - name: k3s-db-url
        secret:
          secretName: module-k3s-db
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - k8s-worker-01
                - k8s-worker-02
      serviceAccountName: opscenter-reader
---
apiVersion: v1
kind: Service
metadata:
  name: module-k3s
  namespace: opscenter
spec:
  selector:
    app: module-k3s
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
