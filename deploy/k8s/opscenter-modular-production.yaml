              name: opscenter-env
              key: OPS_ADMIN_USER
        - name: CREDENTIAL_KEY
          valueFrom:
            secretKeyRef:
              name: opscenter-env
              key: CREDENTIAL_KEY
        volumeMounts:
        - name: opscenter-jwt-public
          mountPath: /run/secrets/opscenter_jwt_public
          subPath: jwt-public.pem
          readOnly: true
        - name: command-code-usage-db-url
          mountPath: /run/secrets/command_code_usage_db_url
          subPath: command_code_usage_db_url
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 300m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
      volumes:
      - name: opscenter-jwt-public
        secret:
          secretName: opscenter-jwt-keypair
      - name: command-code-usage-db-url
        secret:
          secretName: module-command-code-usage-db
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - k8s-worker-01
                - k8s-worker-02
      automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: module-command-code-usage
  namespace: opscenter
spec:
  selector:
    app: module-command-code-usage
  ports:
  - name: http
    port: 8080
    targetPort: 8080
