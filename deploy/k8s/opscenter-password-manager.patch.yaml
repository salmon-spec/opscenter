# Apply as a strategic merge patch after creating the CA ConfigMap from the public certificate.
spec:
  template:
    spec:
      containers:
        - name: backend
          env:
            - name: VAULTWARDEN_URL
              value: https://10.66.66.13:8443
            - name: VAULTWARDEN_CA_FILE
              value: /etc/opscenter/vaultwarden/ca.crt
          volumeMounts:
            - name: vaultwarden-ca
              mountPath: /etc/opscenter/vaultwarden
              readOnly: true
      volumes:
        - name: vaultwarden-ca
          configMap:
            name: opscenter-password-manager-ca-20261025
