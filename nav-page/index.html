<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpsCenter - 运维导航台</title>
<style>
:root {
  --bg: #0f1923;
  --bg-card: #1a2733;
  --bg-hover: #243447;
  --border: #2d3e50;
  --text: #e0e6ed;
  --text-dim: #8b9bb0;
  --accent: #00b4d8;
  --accent-dim: #0077b6;
  --green: #38b249;
  --orange: #e8941a;
  --red: #e74c3c;
  --radius: 8px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}

/* Header */
.header {
  background: linear-gradient(135deg, #0d1b24 0%, #162636 100%);
  border-bottom: 1px solid var(--border);
  padding: 18px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-left { display: flex; align-items: center; gap: 14px; }
.logo {
  width: 40px; height: 40px;
  background: var(--accent);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: bold; color: #fff;
  flex-shrink: 0;
}
.header h1 { font-size: 20px; font-weight: 600; letter-spacing: 0.5px; }
.header h1 span { color: var(--accent); }
.header-right { display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--text-dim); }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); display: inline-block; margin-right: 6px; box-shadow: 0 0 6px var(--green); }
.search-box {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 6px 14px;
  color: var(--text);
  font-size: 13px;
  width: 200px;
  outline: none;
  transition: border-color 0.2s;
}
.search-box:focus { border-color: var(--accent); }
.search-box::placeholder { color: var(--text-dim); }

/* Summary bar */
.summary-bar {
  display: flex;
  gap: 1px;
  background: var(--border);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.summary-item {
  background: var(--bg);
  padding: 10px 20px;
  text-align: center;
  min-width: 100px;
  flex: 1;
}
.summary-item .num { font-size: 22px; font-weight: 700; color: var(--accent); }
.summary-item .label { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

/* Main */
.container { max-width: 1400px; margin: 0 auto; padding: 20px; }

/* Group */
.group { margin-bottom: 28px; }
.group-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.group-icon {
  width: 28px; height: 28px;
  border-radius: 6px;
  background: var(--accent-dim);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.group-icon svg { width: 16px; height: 16px; fill: var(--accent); }
.group-title { font-size: 16px; font-weight: 600; }
.group-count { font-size: 12px; color: var(--text-dim); background: var(--bg-card); padding: 2px 10px; border-radius: 20px; }

/* Cards grid */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 14px;
}

/* Card */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: border-color 0.2s, background 0.2s;
}
.card:hover { border-color: var(--accent); background: var(--bg-hover); }
.card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.card-name { font-size: 15px; font-weight: 600; color: var(--text); }
.card-desc { font-size: 12px; color: var(--text-dim); line-height: 1.5; }
.card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
.tag { font-size: 10px; padding: 2px 8px; border-radius: 4px; background: rgba(0,180,216,0.12); color: var(--accent); border: 1px solid rgba(0,180,216,0.2); }

/* Account info */
.account-info {
  background: rgba(0,0,0,0.2);
  border-radius: 6px;
  padding: 8px 10px;
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.account-info .field { display: flex; align-items: center; gap: 4px; }
.account-info .field-label { color: var(--text-dim); }
.account-info .field-value { color: var(--text); font-family: "Consolas", monospace; }
.account-info .no-auth { color: var(--text-dim); font-style: italic; }
.pwd-mask { cursor: pointer; color: var(--accent); user-select: none; }
.pwd-mask:hover { text-decoration: underline; }

/* Buttons */
.card-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  padding: 6px 14px;
  border-radius: 6px;
  font-size: 12px;
  border: none;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: opacity 0.2s, transform 0.1s;
  font-family: inherit;
}
.btn:active { transform: scale(0.96); }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-dim); }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
.btn-sm { padding: 4px 10px; font-size: 11px; }
.btn svg { width: 13px; height: 13px; }

/* Toast */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--green);
  color: #fff;
  padding: 10px 24px;
  border-radius: var(--radius);
  font-size: 13px;
  z-index: 9999;
  opacity: 0;
  transition: opacity 0.3s, transform 0.3s;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

/* Loading */
.loading { text-align: center; padding: 60px; color: var(--text-dim); font-size: 14px; }
.loading .spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 10px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Footer */
.footer { text-align: center; padding: 24px; color: var(--text-dim); font-size: 12px; border-top: 1px solid var(--border); margin-top: 20px; }

/* Responsive */
@media (max-width: 768px) {
  .header { padding: 12px 16px; }
  .header h1 { font-size: 16px; }
  .header-right { font-size: 12px; }
  .search-box { width: 140px; }
  .container { padding: 12px; }
  .cards-grid { grid-template-columns: 1fr; }
  .summary-item { min-width: 80px; padding: 8px 10px; }
  .summary-item .num { font-size: 18px; }
  .group { margin-bottom: 20px; }
}
@media (max-width: 480px) {
  .header-right .time-display { display: none; }
  .card { padding: 12px; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo">O</div>
    <h1>OpsCenter <span>运维导航台</span></h1>
  </div>
  <div class="header-right">
    <input type="text" class="search-box" id="searchBox" placeholder="搜索服务..." oninput="filterServices()">
    <span><span class="status-dot"></span>系统在线</span>
    <span class="time-display" id="currentTime"></span>
  </div>
</div>

<div class="summary-bar" id="summaryBar">
  <div class="summary-item"><div class="num" id="totalServices">-</div><div class="label">服务总数</div></div>
  <div class="summary-item"><div class="num" id="totalGroups">-</div><div class="label">分组数</div></div>
  <div class="summary-item"><div class="num" id="totalAuth">-</div><div class="label">需认证</div></div>
  <div class="summary-item"><div class="num" id="totalOpen">-</div><div class="label">免认证</div></div>
</div>

<div class="container" id="mainContent">
  <div class="loading">
    <div class="spinner"></div>
    <div>加载服务配置中...</div>
  </div>
</div>

<div class="footer">
  OpsCenter v3.0 运维导航台 &middot; 配置文件: /opt/cicd/nginx/html/ops/services.json &middot; 编辑后刷新即生效
</div>

<div class="toast" id="toast"></div>

<script>
// ====== SVG Icons ======
var ICONS = {
  code: '<svg viewBox="0 0 24 24"><path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>',
  chart: '<svg viewBox="0 0 24 24"><path d="M3.5 18.5l6-6.01 4 4.01L22 6.92l-1.41-1.41-8.09 8.09-4-4L2 17l1.5 1.5z"/></svg>',
  tool: '<svg viewBox="0 0 24 24"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/></svg>',
  database: '<svg viewBox="0 0 24 24"><path d="M12 3C7.58 3 4 4.79 4 7s3.58 4 8 4 8-1.79 8-4-3.58-4-8-4zM4 9v3c0 2.21 3.58 4 8 4s8-1.79 8-4V9c0 2.21-3.58 4-8 4s-8-1.79-8-4zm0 5v3c0 2.21 3.58 4 8 4s8-1.79 8-4v-3c0 2.21-3.58 4-8 4s-8-1.79-8-4z"/></svg>'
};

var allData = null;

// ====== Init ======
function init() {
  loadServices();
  updateClock();
  setInterval(updateClock, 1000);
}

function updateClock() {
  var el = document.getElementById('currentTime');
  if (el) {
    var now = new Date();
    var h = String(now.getHours()).padStart(2, '0');
    var m = String(now.getMinutes()).padStart(2, '0');
    var s = String(now.getSeconds()).padStart(2, '0');
    el.textContent = h + ':' + m + ':' + s;
  }
}

// ====== Load services.json ======
function loadServices() {
  // Add cache-buster to always get latest config
  var url = 'services.json?v=' + Date.now();
  fetch(url)
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(data) {
      allData = data;
      renderServices(data);
    })
    .catch(function(err) {
      document.getElementById('mainContent').innerHTML =
        '<div class="loading" style="color:var(--red)">' +
        '<div style="font-size:16px;margin-bottom:8px">配置加载失败</div>' +
        '<div style="font-size:13px">' + err.message + '</div>' +
        '<div style="font-size:12px;margin-top:8px;color:var(--text-dim)">请检查 services.json 是否存在且格式正确</div>' +
        '</div>';
    });
}

// ====== Render ======
function renderServices(data) {
  var container = document.getElementById('mainContent');
  var groups = data.groups || [];
  var html = '';
  var totalServices = 0;
  var totalAuth = 0;

  groups.forEach(function(g, gi) {
    var services = g.services || [];
    totalServices += services.length;
    var authCount = services.filter(function(s) { return s.authType === 'manual' && s.username; }).length;
    totalAuth += authCount;

    var iconKey = g.icon || 'tool';
    var iconSvg = ICONS[iconKey] || ICONS.tool;

    html += '<div class="group" data-group="' + gi + '">';
    html += '  <div class="group-header">';
    html += '    <div class="group-icon">' + iconSvg + '</div>';
    html += '    <span class="group-title">' + escapeHtml(g.group) + '</span>';
    html += '    <span class="group-count">' + services.length + ' 个服务</span>';
    html += '  </div>';
    html += '  <div class="cards-grid">';

    services.forEach(function(s, si) {
      html += renderCard(s, gi, si);
    });

    html += '  </div>';
    html += '</div>';
  });

  container.innerHTML = html;

  // Update summary
  document.getElementById('totalServices').textContent = totalServices;
  document.getElementById('totalGroups').textContent = groups.length;
  document.getElementById('totalAuth').textContent = totalAuth;
  document.getElementById('totalOpen').textContent = totalServices - totalAuth;
}

function renderCard(s, gi, si) {
  var cardId = 'card-' + gi + '-' + si;
  var fullUrl = resolveUrl(s.url);
  var hasAuth = s.authType === 'manual' && s.username;

  var html = '<div class="card" data-name="' + escapeHtml(s.name.toLowerCase()) + '" data-desc="' + escapeHtml((s.desc || '').toLowerCase()) + '">';
  html += '  <div class="card-top">';
  html += '    <div>';
  html += '      <div class="card-name">' + escapeHtml(s.name) + '</div>';
  html += '      <div class="card-desc">' + escapeHtml(s.desc || '') + '</div>';
  html += '    </div>';
  html += '  </div>';

  // Tags
  if (s.tags && s.tags.length) {
    html += '  <div class="card-tags">';
    s.tags.forEach(function(t) {
      html += '<span class="tag">' + escapeHtml(t) + '</span>';
    });
    html += '  </div>';
  }

  // URL display
  html += '  <div style="font-size:11px;color:var(--text-dim);word-break:break-all;font-family:Consolas,monospace">' + escapeHtml(fullUrl) + '</div>';

  // Account info
  if (hasAuth) {
    html += '  <div class="account-info">';
    html += '    <div class="field"><span class="field-label">账号:</span><span class="field-value">' + escapeHtml(s.username) + '</span></div>';
    html += '    <div class="field"><span class="field-label">密码:</span><span class="pwd-mask" onclick="togglePwd(\'' + cardId + '\')" id="' + cardId + '-mask">••••••</span><span class="field-value" id="' + cardId + '-pwd" style="display:none">' + escapeHtml(s.password || '') + '</span></div>';
    html += '  </div>';
  } else {
    html += '  <div class="account-info"><span class="no-auth">无需认证 / 免登录</span></div>';
  }

  // Actions
  html += '  <div class="card-actions">';
  html += '    <button class="btn btn-primary btn-sm" onclick="openService(\'' + escapeAttr(fullUrl) + '\')">';
  html += '      <svg viewBox="0 0 24 24" style="width:13px;height:13px;fill:currentColor"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>';
  html += '      打开服务';
  html += '    </button>';

  if (hasAuth) {
    html += '  <button class="btn btn-ghost btn-sm" onclick="copyText(\'' + escapeAttr(s.username) + '\', \'账号已复制\')">';
    html += '    <svg viewBox="0 0 24 24" style="width:13px;height:13px;fill:currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>';
    html += '    复制账号';
    html += '  </button>';
    html += '  <button class="btn btn-ghost btn-sm" onclick="copyText(\'' + escapeAttr(s.password || '') + '\', \'密码已复制\')">';
    html += '    <svg viewBox="0 0 24 24" style="width:13px;height:13px;fill:currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>';
    html += '    复制密码';
    html += '  </button>';
  }

  html += '  </div>';
  html += '</div>';

  return html;
}

// ====== URL resolve ======
function resolveUrl(url) {
  if (!url) return '#';
  // Absolute URL (http/https)
  if (/^https?:\/\//i.test(url)) return url;
  // Port-only (e.g. ":8443")
  if (/^:\d+/.test(url)) {
    return window.location.protocol + '//' + window.location.hostname + url;
  }
  // Relative path
  return window.location.origin + url;
}

// ====== Actions ======
function openService(url) {
  window.open(url, '_blank');
}

function copyText(text, msg) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function() {
      showToast(msg || '已复制');
    }).catch(function() {
      fallbackCopy(text, msg);
    });
  } else {
    fallbackCopy(text, msg);
  }
}

function fallbackCopy(text, msg) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    showToast(msg || '已复制');
  } catch (e) {
    showToast('复制失败，请手动复制');
  }
  document.body.removeChild(ta);
}

function togglePwd(cardId) {
  var mask = document.getElementById(cardId + '-mask');
  var pwd = document.getElementById(cardId + '-pwd');
  if (mask && pwd) {
    if (pwd.style.display === 'none') {
      pwd.style.display = 'inline';
      mask.style.display = 'none';
    } else {
      pwd.style.display = 'none';
      mask.style.display = 'inline';
    }
  }
}

function showToast(msg) {
  var toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(function() {
    toast.classList.remove('show');
  }, 2000);
}

// ====== Search filter ======
function filterServices() {
  var keyword = document.getElementById('searchBox').value.trim().toLowerCase();
  var cards = document.querySelectorAll('.card');
  var groups = document.querySelectorAll('.group');

  cards.forEach(function(card) {
    var name = card.getAttribute('data-name') || '';
    var desc = card.getAttribute('data-desc') || '';
    var match = !keyword || name.indexOf(keyword) >= 0 || desc.indexOf(keyword) >= 0;
    card.style.display = match ? '' : 'none';
  });

  // Hide empty groups
  groups.forEach(function(group) {
    var visibleCards = group.querySelectorAll('.card:not([style*="display: none"])');
    group.style.display = visibleCards.length > 0 ? '' : 'none';
  });
}

// ====== Utils ======
function escapeHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function escapeAttr(str) {
  if (str == null) return '';
  return String(str)
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'");
}

// Start
init();
</script>

</body>
</html>
