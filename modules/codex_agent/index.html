async function searchProjects(){await Promise.all(allWorkspaces.filter(w=>!projectTasks.has(w.id)).map(async w=>{const d=await call('/threads','GET',undefined,{workspace:w.id,archived:$('archived').checked});projectTasks.set(w.id,d.items)}));renderProjects()}

function notice(text=''){$('notice').textContent=text?errorText(text):''}
function cooldown(){return Math.max(0,Math.ceil(providerRetryAt-Date.now()/1000))}
function providerState(data){if(!data)return;providerRetryAt=data.retry_at||0;providerError=data.last_error;controls()}
function visibleReply(item){if(item.phase==='analysis')return '';return (item.text||'').replace(/<(think|thinking|analysis)\b[^>]*>[\s\S]*?(?:<\/\1\s*>|$)/gi,'').trim()}
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function button(text,action){const b=el('button',text);b.type='button';b.onclick=()=>guard(action);return b}
async function guard(action){try{return await action()}catch(e){notice(e.message)}}
function call(path,method='GET',body,query){if(!ready)return Promise.reject(Error('请从运维工作台打开 Codex 模块'));const id='codex-'+(++sequence);return new Promise((resolve,reject)=>{const timeout=setTimeout(()=>{requests.delete(id);reject(Error('请求超时，请刷新确认任务状态'))},35000);requests.set(id,{resolve,reject,timeout});parent.postMessage({type:'ops-module-api-request',nonce,id,path:prefix+path,method,body,query:{workspace,...query},timeoutMs:30000},'*')})}
window.addEventListener('message',event=>{if(event.source!==parent)return;const m=event.data;if(m?.type==='ops-module-info'){nonce=m.nonce;ready=true;guard(initialize)}else if(m?.type==='ops-module-api-response'&&m.nonce===nonce){const r=requests.get(m.id);if(!r)return;requests.delete(m.id);clearTimeout(r.timeout);m.ok?r.resolve(m.data):r.reject(Error(errorText(m.data?.message||'请求失败')))}});
parent.postMessage({type:'ops-module-ready'},'*');
function busy(){return submitting||threadData?.turns?.some(t=>t.status==='inProgress')}
function controls(){const active=busy(),wait=cooldown();$('send').disabled=!ready||!$('model').value||active||wait>0;$('workspace-toggle').disabled=active;$('send').title=wait?'限流冷却，'+wait+' 秒后可重试':'发送消息';$('send').hidden=active;$('stop').hidden=!active;$('stop').disabled=!selected||!active||submitting;for(const id of ['mode','model','effort','archive','rename','workspace','workspace-new','new'])$(id).disabled=active;$('state').textContent=wait?'模型限流 · '+wait+'秒':submitting?'正在发送…':active?(threadData?.turns?.some(t=>t.imageGenerating&&t.status==='inProgress')?'正在生成图片…':'正在处理…'):''}
async function initialize(){controls();await Promise.all([loadStatus(),loadModels(),loadWorkspaces(),loadTasks()]);controls()}
async function loadStatus(){const data=await call('/status');providerState(data.provider);$('connection').classList.add('online');$('connection').textContent='Codex '+data.engine_version+' · '+(data.provider.configured?'已有 API 已配置':data.account.account?'已登录':'待连接');$('settings-info').replaceChildren(el('p','模块 '+data.version+' · Codex '+data.engine_version),el('p','服务地址：'+data.provider.base_url),el('p','工作区：'+data.workspace));$('login').disabled=data.provider.configured;$('api-key').disabled=data.provider.configured;$('login-type').disabled=data.provider.configured;if(data.provider.configured)$('login-result').textContent='正在复用旧 Agent 的 API。修改连接需更新模块专用凭据。'}
async function loadModels(){const data=await call('/models'),old=$('model').value;$('model').replaceChildren();for(const m of data.data||[]){const o=el('option',m.displayName||m.model);o.value=m.model;$('model').append(o)}if([...$('model').options].some(o=>o.value===old))$('model').value=old;else{const m=data.data?.find(m=>m.isDefault);if(m)$('model').value=m.model}}
async function loadWorkspaces(){const data=await call('/workspaces');allWorkspaces=data.items;$('workspace').replaceChildren();for(const w of data.items){const o=el('option',w.title);o.value=w.id;$('workspace').append(o)}$('workspace').value=workspace;renderProjects()}
async function loadTasks(){const key=workspace,data=await call('/threads','GET',undefined,{archived:$('archived').checked});if(key!==workspace)return;tasks=data.items;renderTasks()}
function renderTasks(){projectTasks.set(workspace,tasks);renderProjects()}
function draft(){outgoing=null;renderOutgoing();selected='';threadData=null;attachments=[];pending=[];pendingSignature='';revision++;$('title').textContent='新聊天';$('prompt').value='';$('messages').replaceChildren();$('pending').replaceChildren();renderAttachments();renderTasks();notice();controls();emptyState()}
async function select(id){if(submitting)return;outgoing=null;renderOutgoing();selected=id;threadData=null;revision++;notice();renderTasks();await poll()}
async function poll(){if(!selected||polling)return;const id=selected,key=workspace,rev=revision,live=liveRevision;polling=true;try{const data=await call('/threads/'+id);if(selected!==id||workspace!==key||revision!==rev||live!==liveRevision)return;const previous=new Map((threadData?.turns||[]).map(t=>[t.id,t]));threadData=data.thread;for(const turn of threadData.turns||[]){const old=previous.get(turn.id);if(old){if(turn.items?.some(i=>i.type==='userMessage'))old.items=old.items.filter(i=>!i.id.startsWith('submitted-'));const items=new Map((old.items||[]).map(i=>[i.id,i]));for(const item of turn.items||[])items.set(item.id,item);turn.items=[...items.values()]}}$('title').textContent=data.metadata.title;render();controls()}finally{polling=false}}
function picture(img,source){img.alt=img.alt||'图片';img.loading='lazy';img.referrerPolicy='no-referrer';img.removeAttribute('src');img.removeAttribute('srcset');if(/^https?:\/\//i.test(source)||/^data:image\/(png|jpeg|gif|webp);base64,[A-Za-z0-9+/=]+$/.test(source)){img.src=source;return}let path=source.replace(/^file:\/\//,'');const root=workspace==='default'?'/workspace/':'/workspace/projects/'+workspace+'/';if(path.startsWith(root))path=path.slice(root.length);else if(path.startsWith('/')||/^[a-z][a-z0-9+.-]*:/i.test(path)){img.alt='图片不在当前工作区';return}try{path=decodeURIComponent(path)}catch{img.alt='图片路径无效';return}call('/files/content','GET',undefined,{path}).then(d=>{if(d.image)img.src=d.image;else img.alt='文件不是图片'}).catch(e=>{img.alt=e.message})}
function markdown(text,generated=[]){const node=el('div',undefined,'markdown'),content=DOMPurify.sanitize(marked.parse(text||''),{RETURN_DOM_FRAGMENT:true,USE_PROFILES:{html:true},FORBID_TAGS:['iframe','style','script','form','input','video','audio','object','embed']});for(const link of content.querySelectorAll('a')){link.target='_blank';link.rel='noopener noreferrer'}for(const img of content.querySelectorAll('img')){const src=img.getAttribute('src')||'';if(generated.includes(src))img.remove();else picture(img,src)}const paths=new Set();for(const code of content.querySelectorAll('code')){const p=code.textContent.trim();if(!code.closest('pre')&&/^\/workspace\/.+\.(png|jpe?g|gif|webp)$/i.test(p)&&!paths.has(p)&&!generated.includes(p)){paths.add(p);const img=el('img');picture(img,p);code.parentNode.append(img)}}node.append(content);return node}
function render(){const old=new Map([...$('messages').querySelectorAll('[data-item]')].map(n=>[n.dataset.item,n])),fragment=document.createDocumentFragment(),near=$('thread').scrollHeight-$('thread').scrollTop-$('thread').clientHeight<140;for(const turn of threadData?.turns||[]){for(const item of turn.items||[]){if(item.type==='reasoning'||(item.type==='agentMessage'&&!visibleReply(item)))continue;const signature=JSON.stringify(item),existing=old.get(item.id);if(existing?.dataset.signature===signature){fragment.append(existing);continue}let n=el('article',undefined,item.type==='userMessage'?'message-user':'message-agent');n.dataset.item=item.id;n.dataset.signature=signature;if(item.type==='userMessage'){n.append(el('div','你','label'));for(const c of item.content||[]){if(c.type==='text')n.append(el('div',c.text,'text'));else if(c.type==='localImage'||c.type==='image'){const img=el('img',undefined,'attachment-image');picture(img,c.path||c.url||'');n.append(img)}}}else if(item.type==='agentMessage'){if(item.phase==='commentary'){const d=el('details',undefined,'activity');d.open=existing?.querySelector('details')?.open||false;d.append(el('summary','执行进展'),markdown(visibleReply(item),(turn.images||[]).map(i=>i.path)));n.append(d)}else n.append(el('div','Codex','label'),markdown(visibleReply(item),(turn.images||[]).map(i=>i.path)))}else if(item.type==='reasoning'){const d=el('details',undefined,'reasoning');d.append(el('summary','思考过程'),el('pre',(item.summary||item.content||[]).join('\n')));n.append(d)}else{const d=el('details',undefined,'tool');d.open=existing?.querySelector('details')?.open||false;d.append(el('summary',(item.type==='commandExecution'?'终端':item.type==='fileChange'?'文件变更':item.type)+' · '+(item.status||'')));if(item.command)d.append(el('pre',item.command));if(item.aggregatedOutput)d.append(el('pre',item.aggregatedOutput));if(item.changes)d.append(el('pre',item.changes.map(c=>c.path+'\n'+c.diff).join('\n')));if(item.type==='imageView'&&item.path){const img=el('img');picture(img,item.path);d.append(img)}if(item.error)d.append(el('pre',JSON.stringify(item.error)));n.append(d)}fragment.append(n)}for(const image of turn.images||[]){const key='generated-'+image.id,existing=old.get(key);if(existing){fragment.append(existing);continue}const card=el('figure',undefined,'generated-image');card.dataset.item=key;const img=el('img');img.alt=image.description||'生成的图片';picture(img,image.path);const caption=el('figcaption');caption.append(el('span','已生成图片'),button('查看原图',()=>openFile(image.path.slice((workspace==='default'?'/workspace/':'/workspace/projects/'+workspace+'/').length))));card.append(img,caption);fragment.append(card)}if(turn.error){const card=el('div',undefined,'error');card.append(el('p',errorText(turn.error.message||JSON.stringify(turn.error))));const input=turn.items?.find(i=>i.type==='userMessage')?.content?.filter(c=>c.type==='text').map(c=>c.text).join('\n');if(input)card.append(button('将问题放回输入框',()=>{$('prompt').value=input;$('prompt').focus()}));fragment.append(card)}}$('messages').replaceChildren(fragment);emptyState();if(near)$('thread').scrollTop=$('thread').scrollHeight}
function ensureTurn(id){if(!threadData)threadData={turns:[]};threadData.turns||=[];let turn=threadData.turns.find(t=>t.id===id);if(!turn){turn={id,status:'inProgress',items:[]};threadData.turns.push(turn)}return turn}
function mergeTurn(value){const turn=ensureTurn(value.id);if(value.items?.some(i=>i.type==='userMessage'))turn.items=turn.items.filter(i=>!i.id.startsWith('submitted-'));const items=new Map((turn.items||[]).map(i=>[i.id,i]));for(const item of value.items||[])items.set(item.id,item);Object.assign(turn,value);turn.items=[...items.values()]}
async function pull(){if(!ready||pulling)return;lastPullAt=performance.now();const key=workspace;pulling=true;try{const data=await call('/events','GET',undefined,{cursor});if(key!==workspace)return;if(generation&&generation!==data.generation){cursor=0;threadData=null;await poll()}generation=data.generation;cursor=data.cursor;providerState(data.provider);pending=data.pending.filter(p=>p.params.threadId===selected);renderPending();let changed=false,refresh=data.refresh;for(const e of data.events){const p=e.params||{};if(p.threadId!==selected)continue;liveRevision++;if(e.method==='turn/started'){mergeTurn(p.turn);changed=true}else if(e.method==='turn/completed'){mergeTurn(p.turn);changed=true;refresh=true}else if(e.method==='item/started'||e.method==='item/completed'){const t=ensureTurn(p.turnId);if(p.item.type==='userMessage')t.items=t.items.filter(i=>!i.id.startsWith('submitted-'));const i=t.items.findIndex(x=>x.id===p.item.id);if(i<0)t.items.push(p.item);else t.items[i]=p.item;changed=true}else if(e.method==='item/agentMessage/delta'){const t=ensureTurn(p.turnId);let i=t.items.find(i=>i.id===p.itemId);if(!i){i={id:p.itemId,type:'agentMessage',text:''};t.items.push(i)}i.text+=p.delta;changed=true}else if(e.method==='item/commandExecution/outputDelta'){const t=ensureTurn(p.turnId),i=t.items.find(i=>i.id===p.itemId);if(i){i.aggregatedOutput=(i.aggregatedOutput||'')+p.delta;changed=true}}else if(e.method==='item/image/generating'){ensureTurn(p.turnId).imageGenerating=true;changed=true}else if(e.method==='item/image/generated'){const turn=ensureTurn(p.turnId);turn.images||=[];if(!turn.images.some(i=>i.id===p.image.id))turn.images.push(p.image);turn.imageGenerating=false;changed=true}else if(e.method==='error')notice(p.error?.message||'Codex 执行失败');if(p.refresh)refresh=true}if(changed)render();controls();if(refresh)await poll()}finally{pulling=false}}
function renderPending(){const signature=JSON.stringify(pending);if(signature===pendingSignature)return;pendingSignature=signature;$('pending').replaceChildren();for(const request of pending){const card=el('section'),p=request.params;card.append(el('strong',request.method.includes('requestUserInput')?'Codex 需要补充信息':'Codex 请求批准'));if(p.command)card.append(el('pre',p.command));if(p.reason)card.append(el('p',p.reason));if(request.method==='item/tool/requestUserInput'){const answers={};for(const q of p.questions||[]){card.append(el('p',q.question));const input=el('input');input.placeholder=(q.options||[]).map(o=>o.label).join(' / ');input.oninput=()=>answers[q.id]=[input.value];card.append(input)}card.append(button('提交回答',async()=>{await call('/approvals/'+request.id,'POST',{answers});await pull()}))}else{card.append(button('批准一次',async()=>{await call('/approvals/'+request.id,'POST',{decision:'accept'});await pull()}),button('拒绝',async()=>{await call('/approvals/'+request.id,'POST',{decision:'decline'});await pull()}))}$('pending').append(card)}}
$('composer').onsubmit=e=>{e.preventDefault();guard(async()=>{if(busy()||cooldown())return;const text=$('prompt').value.trim();if(!text)return;const files=[...attachments],model=$('model').value,effort=$('effort').value,mode=$('mode').value;submitting=true;outgoing={text,attachments:files};$('prompt').value='';$('prompt').style.height='';attachments=[];renderAttachments();renderOutgoing();controls();notice();let accepted=false;try{if(!selected){const row=await call('/threads','POST',{title:text.slice(0,80),model});selected=row.id;revision++;threadData={turns:[]};tasks.unshift({id:selected,title:text.slice(0,80),archived:0});$('title').textContent=text.slice(0,80);renderTasks()}const result=await call('/threads/'+selected+'/prompt','POST',{text,model,effort,mode,attachments:files});accepted=true;const turn=result.turn,live=threadData?.turns?.find(t=>t.id===turn.id);if(!live||live.status==='inProgress')mergeTurn(turn);const local=ensureTurn(turn.id);if(!local.items.some(i=>i.type==='userMessage'))local.items.unshift({id:'submitted-'+turn.id,type:'userMessage',content:[{type:'text',text},...files.map(path=>({type:'text',text:path}))]});outgoing=null;renderOutgoing();render();guard(pull)}catch(e){outgoing=null;renderOutgoing();if(!accepted&&!$('prompt').value){$('prompt').value=text;attachments=files;renderAttachments()}throw e}finally{submitting=false;controls()}})};
$('prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('composer').requestSubmit()}};
$('stop').onclick=()=>guard(async()=>{await call('/threads/'+selected+'/stop','POST',{});await poll()});
$('sidebar-toggle').onclick=()=>document.body.classList.toggle(matchMedia('(max-width:760px)').matches?'sidebar-open':'sidebar-collapsed');$('sidebar-close').onclick=()=>document.body.classList.remove('sidebar-open');$('new').onclick=()=>{sidebarMode='chats';draft();document.body.classList.remove('sidebar-open')};$('refresh').onclick=()=>guard(async()=>{await Promise.all([loadStatus(),loadTasks(),poll()])});$('history-filter').oninput=()=>guard(searchProjects);$('archived').onchange=()=>guard(async()=>{projectTasks.clear();await loadTasks();await searchProjects()});
$('workspace').onchange=()=>guard(()=>changeWorkspace($('workspace').value));
function askFields(title,fields){return new Promise(resolve=>{const dialog=el('dialog'),form=el('form'),inputs={};form.append(el('h3',title));for(const field of fields){const label=el('label',field.label),input=el('input');input.value=field.value||'';input.required=true;input.setAttribute('aria-label',field.label);inputs[field.name]=input;label.append(input);form.append(label)}const save=el('button','保存');save.type='submit';const cancel=button('取消',()=>{dialog.close();dialog.remove();resolve(null)});form.append(save,cancel);form.onsubmit=e=>{e.preventDefault();const result=Object.fromEntries(Object.entries(inputs).map(([k,v])=>[k,v.value.trim()]));dialog.close();dialog.remove();resolve(result)};dialog.oncancel=()=>{dialog.remove();resolve(null)};dialog.append(form);document.body.append(dialog);dialog.showModal()})}
$('workspace-new').onclick=()=>guard(async()=>{const data=await askFields('新建工作区',[{name:'title',label:'工作区名称'},{name:'name',label:'工作区标识（小写字母/数字/连字符）'}]);if(data){await call('/workspaces','POST',data);await loadWorkspaces()}});
$('rename').onclick=()=>guard(async()=>{if(!selected)return;const data=await askFields('重命名任务',[{name:'title',label:'任务名称',value:$('title').textContent}]);if(data){await call('/threads/'+selected+'/edit','POST',data);await Promise.all([poll(),loadTasks()])}});
$('archive').onclick=()=>guard(async()=>{if(selected){await call('/threads/'+selected+'/edit','POST',{archived:!$('archived').checked});draft();await loadTasks()}});
function renderAttachments(){$('attachments').replaceChildren();for(const path of attachments){const chip=el('span',path,'attachment-chip');chip.append(button('×',()=>{attachments=attachments.filter(p=>p!==path);renderAttachments()}));$('attachments').append(chip)}}
$('attach').onclick=()=>$('upload').click();$('upload').onchange=()=>guard(async()=>{try{for(const f of $('upload').files){if(attachments.length>=10)throw Error('最多附加 10 个文件');if(f.size>2*1024*1024)throw Error('单文件限 2 MiB');const content=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=()=>reject(Error('读取文件失败'));r.readAsDataURL(f)});const path='attachments/'+Date.now()+'-'+f.name.replace(/[^a-zA-Z0-9._\-\u4e00-\u9fff]/g,'_');await call('/files/write','POST',{path,content,encoding:'base64'});attachments.push(path)}renderAttachments()}finally{$('upload').value=''}});
for(const b of document.querySelectorAll('[data-panel]'))b.onclick=()=>guard(()=>panel(b.dataset.panel));$('panel-close').onclick=()=>$('inspector').hidden=true;
async function panel(name){$('inspector').hidden=false;$('panel-title').textContent={files:'工作区文件',terminal:'工作区命令',changes:'文件变更',extensions:'技能与 MCP',audit:'操作审计'}[name];const host=$('panel-content');host.replaceChildren();if(name==='files'){await browse(fileDirectory)}else if(name==='terminal'){const input=el('textarea');input.placeholder='在当前容器工作区执行命令（最长 20 秒）';const output=el('pre');host.append(input,button('执行',async()=>{const d=await call('/terminal','POST',{command:input.value});output.textContent=d.output+'\n退出码：'+d.exit_code}),output)}else if(name==='changes'){const d=await call('/terminal','POST',{command:'git status --short && git diff --stat && git diff --no-ext-diff'});host.append(el('pre',d.output))}else{const d=await call(name==='extensions'?'/extensions':'/audit');host.append(el('pre',JSON.stringify(d,null,2)))}}
async function browse(path=''){const data=await call('/files','GET',undefined,{path});fileDirectory=path;const host=$('panel-content');host.replaceChildren(el('p','/workspace/'+path,'file-path'),button('上级',()=>browse(path.split('/').slice(0,-1).join('/'))),button('新建文件',()=>edit((path?path+'/':'')+'new.txt','',false)),button('刷新',()=>browse(path)));for(const f of data.items)host.append(button((f.directory?'▸ ':'')+f.name,()=>f.directory?browse(f.path):openFile(f.path)))}
async function openFile(path){const d=await call('/files/content','GET',undefined,{path});if(d.image){const dialog=el('dialog'),img=el('img');img.src=d.image;img.style.maxWidth='100%';dialog.append(el('p',path),img,button('关闭',()=>{dialog.close();dialog.remove()}));document.body.append(dialog);dialog.showModal()}else edit(path,d.content,true)}
function edit(path,content,overwrite){$('editor-title').textContent='编辑工作区文件';$('edit-path').value=path;$('edit-content').value=content;$('edit-overwrite').checked=overwrite;$('edit-notice').textContent='';$('editor').showModal()}
$('edit-close').onclick=()=>$('editor').close();$('edit-save').onclick=()=>guard(async()=>{await call('/files/write','POST',{path:$('edit-path').value,content:$('edit-content').value,overwrite:$('edit-overwrite').checked});$('edit-notice').textContent='已保存';$('edit-overwrite').checked=true});
$('settings').onclick=()=>guard(async()=>{await loadStatus();$('settings-dialog').showModal()});$('settings-close').onclick=()=>$('settings-dialog').close();$('login').onclick=()=>guard(async()=>{const d=await call('/account/login','POST',{type:$('login-type').value,api_key:$('api-key').value});$('api-key').value='';$('login-result').textContent=JSON.stringify(d,null,2);await loadStatus()});
setInterval(()=>{if(ready)controls()},1000);
setInterval(()=>{if(ready&&!document.hidden&&performance.now()-lastPullAt>(busy()?150:selected?1500:4000))guard(pull)},150);setInterval(()=>{if(ready&&selected&&!document.hidden)guard(poll)},20000);setInterval(()=>{if(ready&&!document.hidden&&!busy())guard(loadTasks)},30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ready){guard(pull);guard(poll)}});
$('sidebar-collapse').onclick=()=>document.body.classList.add('sidebar-collapsed');$('chats-nav').onclick=()=>{sidebarMode='chats';$('history-filter').value='';renderProjects()};$('projects-nav').onclick=()=>{sidebarMode='projects';$('history-filter').value='';renderProjects()};$('workbench').onclick=()=>navigateHost('/');$('workspace-toggle').onclick=()=>{const open=$('workspace-menu').hidden;$('workspace-menu').hidden=!open;$('workspace-toggle').setAttribute('aria-expanded',String(open))};$('search-toggle').onclick=()=>{$('sidebar-filter').hidden=false;$('history-filter').focus()};$('filter-toggle').onclick=()=>{$('sidebar-filter').hidden=!$('sidebar-filter').hidden};document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('search-toggle').click()}});
$('theme').onchange=()=>{const value=$('theme').value;if(value==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=value};
$('prompt').addEventListener('input',()=>{$('prompt').style.height='auto';$('prompt').style.height=Math.min($('prompt').scrollHeight,180)+'px'});for(const b of document.querySelectorAll('[data-suggestion]'))b.onclick=()=>{$('prompt').value=b.dataset.suggestion;$('prompt').focus()};for(const b of document.querySelectorAll('.more-menu button'))b.addEventListener('click',()=>b.closest('details').open=false);
</script></body></html>
