async function panel(name){$('inspector').hidden=false;$('panel-title').textContent={files:'工作区文件',terminal:'工作区命令',changes:'文件变更',extensions:'技能与 MCP',audit:'操作审计'}[name];const host=$('panel-content');delete host._changesRequest;delete host._extensionsRequest;host.replaceChildren();if(name==='files'){await browse(fileDirectory)}else if(name==='terminal'){const input=el('textarea');input.placeholder='在当前容器工作区执行命令（最长 20 秒）';const output=el('pre');host.append(input,projectWriteButton('执行',async()=>{const d=await call('/terminal','POST',{command:input.value});output.textContent=d.output+'\n退出码：'+d.exit_code}),output)}else if(name==='changes'){await showChanges(host)}else if(name==='extensions'){await showExtensions(host)}else{const d=await call('/audit');host.append(el('pre',JSON.stringify(d,null,2)))}}
async function browse(path=''){const data=await call('/files','GET',undefined,{path});fileDirectory=path;const host=$('panel-content');host.replaceChildren(el('p','/workspace/'+path,'file-path'),button('上级',()=>browse(path.split('/').slice(0,-1).join('/'))),projectWriteButton('新建文件',()=>edit((path?path+'/':'')+'new.txt','',false)),button('刷新',()=>browse(path)));for(const f of data.items)host.append(button((f.directory?'▸ ':'')+f.name,()=>f.directory?browse(f.path):openFile(f.path)))}
async function openFile(path){const d=await call('/files/content','GET',undefined,{path});if(d.image){const dialog=el('dialog'),img=el('img');img.src=d.image;img.style.maxWidth='100%';dialog.append(el('p',path),img,button('关闭',()=>{dialog.close();dialog.remove()}));document.body.append(dialog);dialog.showModal()}else edit(path,d.content,true)}
function edit(path,content,overwrite){$('editor-title').textContent='编辑工作区文件';$('edit-path').value=path;$('edit-content').value=content;$('edit-overwrite').checked=overwrite;$('edit-notice').textContent='';$('editor').showModal()}
$('edit-close').onclick=()=>$('editor').close();$('edit-save').onclick=()=>guard(async()=>{requireWritableProject();await call('/files/write','POST',{path:$('edit-path').value,content:$('edit-content').value,overwrite:$('edit-overwrite').checked});$('edit-notice').textContent='已保存';$('edit-overwrite').checked=true});
$('settings').onclick=()=>guard(async()=>{await loadStatus();$('settings-dialog').showModal()});$('settings-close').onclick=()=>$('settings-dialog').close();$('login').onclick=()=>guard(async()=>{const d=await call('/account/login','POST',{type:$('login-type').value,api_key:$('api-key').value});$('api-key').value='';$('login-result').textContent=JSON.stringify(d,null,2);await loadStatus()});
setInterval(()=>{if(ready)controls()},1000);
setInterval(()=>{if(ready&&!document.hidden&&performance.now()-lastPullAt>(busy()?150:selected?1500:4000))guard(pull)},150);setInterval(()=>{if(ready&&selected&&!document.hidden)guard(poll)},20000);setInterval(()=>{if(ready&&!document.hidden&&!busy())guard(loadTasks)},30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ready){guard(pull);guard(poll)}});
$('sidebar-collapse').onclick=()=>document.body.classList.add('sidebar-collapsed');$('chats-nav').onclick=()=>guard(async()=>{sidebarMode='chats';$('history-filter').value='';await setSidebarView('active')});$('projects-nav').onclick=()=>guard(async()=>{sidebarMode='projects';$('history-filter').value='';await setSidebarView('active');await searchProjects()});$('archived-nav').onclick=()=>guard(async()=>{sidebarMode='projects';$('history-filter').value='';await setSidebarView('archived')});$('trash-nav').onclick=()=>guard(async()=>{sidebarMode='projects';$('history-filter').value='';await setSidebarView('deleted')});$('workbench').onclick=()=>navigateHost('/');$('workspace-toggle').onclick=()=>{const open=$('workspace-menu').hidden;$('workspace-menu').hidden=!open;$('workspace-toggle').setAttribute('aria-expanded',String(open))};$('search-toggle').onclick=()=>{$('sidebar-filter').hidden=false;$('history-filter').focus()};$('filter-toggle').onclick=()=>{$('sidebar-filter').hidden=!$('sidebar-filter').hidden};document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('search-toggle').click()}});
$('theme').onchange=()=>{const value=$('theme').value;if(value==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=value};
$('thread').addEventListener('scroll',()=>{followThread=$('thread').scrollHeight-$('thread').scrollTop-$('thread').clientHeight<2});
$('prompt').addEventListener('input',()=>{$('prompt').style.height='auto';$('prompt').style.height=Math.min($('prompt').scrollHeight,180)+'px'});for(const b of document.querySelectorAll('[data-suggestion]'))b.onclick=()=>{$('prompt').value=b.dataset.suggestion;$('prompt').focus()};for(const b of document.querySelectorAll('.more-menu button'))b.addEventListener('click',()=>b.closest('details').open=false);
</script></body></html>
