</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><div><span class="brand-icon">⌘</span>Codex</div><button id="sidebar-close" aria-label="关闭任务列表">×</button></div><button id="new" class="new-task"><span>＋</span> 新任务</button><div class="workspace-tools"><select id="workspace" aria-label="工作区"></select><button id="workspace-new" title="新建工作区" aria-label="新建工作区">＋</button></div><div class="section-label">任务</div><input id="history-filter" class="search" placeholder="搜索任务…" aria-label="搜索任务"><label class="archive-filter"><input id="archived" type="checkbox"> 已归档</label><div id="tasks" class="task-list"></div><div class="sidebar-foot"><button id="settings">⚙　连接设置</button><div id="connection" class="connection" role="status">正在连接…</div></div></aside><main class="main"><header class="topbar"><div class="topbar-left"><button id="sidebar-toggle" class="icon-button" aria-label="切换任务列表" title="切换侧栏">☰</button><h2 id="title">新任务</h2><span id="state" class="muted" role="status"></span></div><div class="toolbar"><button data-panel="files">文件</button><button data-panel="terminal">终端</button><button data-panel="changes">查看变更</button><details class="more"><summary aria-label="更多操作">···</summary><div class="more-menu"><button id="rename">重命名</button><button id="archive">归档 / 恢复</button><button data-panel="extensions">技能与 MCP</button><button data-panel="audit">操作审计</button><button id="refresh">刷新状态</button></div></details></div></header><div id="thread" class="thread empty"><div class="conversation"><section id="welcome" class="welcome"><div class="welcome-mark">⌘</div><h1>今天想做些什么？</h1><p>从一个问题开始，或交给 Codex 一项任务。</p><div class="suggestions"><button type="button" data-suggestion="帮我了解当前项目的结构与运行方式。">了解项目</button><button type="button" data-suggestion="检查当前项目，找出一个值得修复的问题。">修复问题</button><button type="button" data-suggestion="先查看工作区，帮我规划接下来要实现的功能。">规划功能</button></div></section><div id="messages"></div><div id="outbox"></div><div id="pending"></div></div></div><div class="composer-wrap"><div id="notice" class="notice" role="alert"></div><form id="composer" class="composer"><textarea id="prompt" placeholder="向 Codex 发送消息…" aria-label="任务指令" maxlength="20000" required></textarea><div id="attachments"></div><div class="composer-bottom"><div class="composer-options"><button id="attach" class="attach-button" type="button" title="添加附件" aria-label="添加附件">＋</button><input id="upload" type="file" multiple hidden><select id="model" aria-label="模型"></select><select id="effort" aria-label="推理强度"><option value="low">低推理</option><option value="medium" selected>中等推理</option><option value="high">高推理</option><option value="xhigh">超高推理</option></select><select id="mode" aria-label="权限"><option value="ask">需要询问</option><option value="full">完全控制 · 容器</option><option value="plan">Plan · 只读规划</option></select></div><button id="send" class="send-button" type="submit" aria-label="发送" title="发送消息">↑</button><button id="stop" class="stop-button" type="button" aria-label="停止" title="停止执行" hidden disabled>■</button></div></form><p class="composer-note">Enter 发送 · Shift + Enter 换行</p></div></main><aside id="inspector" class="inspector" hidden><div class="inspector-head"><strong id="panel-title"></strong><button id="panel-close" aria-label="关闭面板">×</button></div><div id="panel-content"></div></aside></div><dialog id="settings-dialog"><h2>连接设置</h2><div id="settings-info"></div><p class="muted">已保存的 API 凭据仅用于服务端请求，不回传到页面。</p><label>登录方式<select id="login-type"><option value="apiKey">OpenAI API Key</option><option value="chatgptDeviceCode">ChatGPT 设备授权</option></select></label><input id="api-key" type="password" autocomplete="new-password" placeholder="API Key"><button id="login">登录 / 保存</button><button id="settings-close">关闭</button><pre id="login-result"></pre></dialog><dialog id="editor"><h3 id="editor-title"></h3><input id="edit-path" aria-label="文件路径"><textarea id="edit-content" style="width:100%;min-height:320px" aria-label="文件内容"></textarea><label><input id="edit-overwrite" type="checkbox"> 覆盖已有文件</label><button id="edit-save">保存</button><button id="edit-close">关闭</button><div id="edit-notice" role="status"></div></dialog><script>/* VENDOR:marked.js */</script><script>/* VENDOR:purify.js */</script><script>
const $=id=>document.getElementById(id),prefix='/modules/codex-agent/api/v1';
let ready=false,nonce='',sequence=0,workspace='default',selected='',threadData=null,cursor=0,generation=0,revision=0,liveRevision=0,polling=false,pulling=false,submitting=false,attachments=[],tasks=[],pending=[],fileDirectory='';
const requests=new Map();let pendingSignature='',outgoing=null,lastPullAt=0;
function emptyState(){const empty=!outgoing&&!(threadData?.turns||[]).some(t=>(t.items||[]).length);$('welcome').hidden=!empty;$('thread').classList.toggle('empty',empty)}
function renderOutgoing(){const host=$('outbox');host.replaceChildren();if(outgoing){const row=el('article',undefined,'message-user');row.append(el('div',outgoing.text,'text'));for(const path of outgoing.attachments)row.append(el('small',path,'muted'));const status=el('div',undefined,'submission-status');status.append(el('span',undefined,'spinner'),el('span','正在发送…'));host.append(row,status)}emptyState();$('thread').scrollTop=$('thread').scrollHeight}
function notice(text=''){$('notice').textContent=text}
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function button(text,action){const b=el('button',text);b.type='button';b.onclick=()=>guard(action);return b}
async function guard(action){try{return await action()}catch(e){notice(e.message)}}
function call(path,method='GET',body,query){if(!ready)return Promise.reject(Error('请从运维工作台打开 Codex 模块'));const id='codex-'+(++sequence);return new Promise((resolve,reject)=>{const timeout=setTimeout(()=>{requests.delete(id);reject(Error('请求超时，请刷新确认任务状态'))},35000);requests.set(id,{resolve,reject,timeout});parent.postMessage({type:'ops-module-api-request',nonce,id,path:prefix+path,method,body,query:{workspace,...query},timeoutMs:30000},'*')})}
window.addEventListener('message',event=>{if(event.source!==parent)return;const m=event.data;if(m?.type==='ops-module-info'){nonce=m.nonce;ready=true;guard(initialize)}else if(m?.type==='ops-module-api-response'&&m.nonce===nonce){const r=requests.get(m.id);if(!r)return;requests.delete(m.id);clearTimeout(r.timeout);m.ok?r.resolve(m.data):r.reject(Error(m.data?.message||'请求失败'))}});
parent.postMessage({type:'ops-module-ready'},'*');
function busy(){return submitting||threadData?.turns?.some(t=>t.status==='inProgress')}
function controls(){const active=busy();$('send').disabled=!ready||!$('model').value||active;$('send').hidden=active;$('stop').hidden=!active;$('stop').disabled=!selected||!active||submitting;for(const id of ['mode','model','effort','archive','rename','workspace','workspace-new','new'])$(id).disabled=active;$('state').textContent=submitting?'正在发送…':active?'正在思考…':''}
async function initialize(){controls();await Promise.all([loadStatus(),loadModels(),loadWorkspaces(),loadTasks()]);controls()}
async function loadStatus(){const data=await call('/status');$('connection').classList.add('online');$('connection').textContent='Codex '+data.engine_version+' · '+(data.provider.configured?'已有 API 已配置':data.account.account?'已登录':'待连接');$('settings-info').replaceChildren(el('p','模块 '+data.version+' · Codex '+data.engine_version),el('p','服务地址：'+data.provider.base_url),el('p','工作区：'+data.workspace));$('login').disabled=data.provider.configured;$('api-key').disabled=data.provider.configured;$('login-type').disabled=data.provider.configured;if(data.provider.configured)$('login-result').textContent='正在复用旧 Agent 的 API。修改连接需更新模块专用凭据。'}
async function loadModels(){const data=await call('/models'),old=$('model').value;$('model').replaceChildren();for(const m of data.data||[]){const o=el('option',m.displayName||m.model);o.value=m.model;$('model').append(o)}if([...$('model').options].some(o=>o.value===old))$('model').value=old;else{const m=data.data?.find(m=>m.isDefault);if(m)$('model').value=m.model}}
async function loadWorkspaces(){const data=await call('/workspaces');$('workspace').replaceChildren();for(const w of data.items){const o=el('option',w.title);o.value=w.id;$('workspace').append(o)}$('workspace').value=workspace}
async function loadTasks(){const key=workspace,data=await call('/threads','GET',undefined,{archived:$('archived').checked});if(key!==workspace)return;tasks=data.items;renderTasks()}
function renderTasks(){$('tasks').replaceChildren();const filter=$('history-filter').value.toLowerCase();for(const t of tasks.filter(t=>t.title.toLowerCase().includes(filter))){const b=button(t.title,()=>select(t.id));b.classList.toggle('active',selected===t.id);$('tasks').append(b)}}
function draft(){outgoing=null;renderOutgoing();selected='';threadData=null;attachments=[];pending=[];pendingSignature='';revision++;$('title').textContent='新任务';$('prompt').value='';$('messages').replaceChildren();$('pending').replaceChildren();renderAttachments();renderTasks();notice();controls();emptyState()}
async function select(id){if(submitting)return;outgoing=null;renderOutgoing();selected=id;threadData=null;revision++;notice();renderTasks();await poll()}
async function poll(){if(!selected||polling)return;const id=selected,key=workspace,rev=revision,live=liveRevision;polling=true;try{const data=await call('/threads/'+id);if(selected!==id||workspace!==key||revision!==rev||live!==liveRevision)return;const previous=new Map((threadData?.turns||[]).map(t=>[t.id,t]));threadData=data.thread;for(const turn of threadData.turns||[]){const old=previous.get(turn.id);if(old){if(turn.items?.some(i=>i.type==='userMessage'))old.items=old.items.filter(i=>!i.id.startsWith('submitted-'));const items=new Map((old.items||[]).map(i=>[i.id,i]));for(const item of turn.items||[])items.set(item.id,item);turn.items=[...items.values()]}}$('title').textContent=data.metadata.title;render();controls()}finally{polling=false}}
function picture(img,source){img.alt=img.alt||'图片';img.loading='lazy';img.referrerPolicy='no-referrer';img.removeAttribute('src');img.removeAttribute('srcset');if(/^https?:\/\//i.test(source)||/^data:image\/(png|jpeg|gif|webp);base64,[A-Za-z0-9+/=]+$/.test(source)){img.src=source;return}let path=source.replace(/^file:\/\//,'');const root=workspace==='default'?'/workspace/':'/workspace/projects/'+workspace+'/';if(path.startsWith(root))path=path.slice(root.length);else if(path.startsWith('/')||/^[a-z][a-z0-9+.-]*:/i.test(path)){img.alt='图片不在当前工作区';return}try{path=decodeURIComponent(path)}catch{img.alt='图片路径无效';return}call('/files/content','GET',undefined,{path}).then(d=>{if(d.image)img.src=d.image;else img.alt='文件不是图片'}).catch(e=>{img.alt=e.message})}
function markdown(text){const node=el('div',undefined,'markdown'),content=DOMPurify.sanitize(marked.parse(text||''),{RETURN_DOM_FRAGMENT:true,USE_PROFILES:{html:true},FORBID_TAGS:['iframe','style','script','form','input','video','audio','object','embed']});for(const link of content.querySelectorAll('a')){link.target='_blank';link.rel='noopener noreferrer'}for(const img of content.querySelectorAll('img'))picture(img,img.getAttribute('src')||'');const paths=new Set();for(const code of content.querySelectorAll('code')){const p=code.textContent.trim();if(!code.closest('pre')&&/^\/workspace\/.+\.(png|jpe?g|gif|webp)$/i.test(p)&&!paths.has(p)){paths.add(p);const img=el('img');picture(img,p);code.parentNode.append(img)}}node.append(content);return node}
function render(){const old=new Map([...$('messages').querySelectorAll('[data-item]')].map(n=>[n.dataset.item,n])),fragment=document.createDocumentFragment(),near=$('thread').scrollHeight-$('thread').scrollTop-$('thread').clientHeight<140;for(const turn of threadData?.turns||[]){for(const item of turn.items||[]){const signature=JSON.stringify(item),existing=old.get(item.id);if(existing?.dataset.signature===signature){fragment.append(existing);continue}let n=el('article',undefined,item.type==='userMessage'?'message-user':'message-agent');n.dataset.item=item.id;n.dataset.signature=signature;if(item.type==='userMessage'){n.append(el('div','你','label'));for(const c of item.content||[]){if(c.type==='text')n.append(el('div',c.text,'text'));else if(c.type==='localImage'||c.type==='image'){const img=el('img',undefined,'attachment-image');picture(img,c.path||c.url||'');n.append(img)}}}else if(item.type==='agentMessage'){n.append(el('div','Codex','label'),markdown(item.text))}else if(item.type==='reasoning'){const d=el('details',undefined,'reasoning');d.append(el('summary','思考过程'),el('pre',(item.summary||item.content||[]).join('\n')));n.append(d)}else{const d=el('details',undefined,'tool');d.open=existing?.querySelector('details')?.open||false;d.append(el('summary',(item.type==='commandExecution'?'终端':item.type==='fileChange'?'文件变更':item.type)+' · '+(item.status||'')));if(item.command)d.append(el('pre',item.command));if(item.aggregatedOutput)d.append(el('pre',item.aggregatedOutput));if(item.changes)d.append(el('pre',item.changes.map(c=>c.path+'\n'+c.diff).join('\n')));if(item.type==='imageView'&&item.path){const img=el('img');picture(img,item.path);d.append(img)}if(item.error)d.append(el('pre',JSON.stringify(item.error)));n.append(d)}fragment.append(n)}if(turn.error)fragment.append(el('div',turn.error.message||JSON.stringify(turn.error),'error'))}$('messages').replaceChildren(fragment);emptyState();if(near)$('thread').scrollTop=$('thread').scrollHeight}
function ensureTurn(id){if(!threadData)threadData={turns:[]};threadData.turns||=[];let turn=threadData.turns.find(t=>t.id===id);if(!turn){turn={id,status:'inProgress',items:[]};threadData.turns.push(turn)}return turn}
function mergeTurn(value){const turn=ensureTurn(value.id);if(value.items?.some(i=>i.type==='userMessage'))turn.items=turn.items.filter(i=>!i.id.startsWith('submitted-'));const items=new Map((turn.items||[]).map(i=>[i.id,i]));for(const item of value.items||[])items.set(item.id,item);Object.assign(turn,value);turn.items=[...items.values()]}
async function pull(){if(!ready||pulling)return;lastPullAt=performance.now();const key=workspace;pulling=true;try{const data=await call('/events','GET',undefined,{cursor});if(key!==workspace)return;if(generation&&generation!==data.generation){cursor=0;threadData=null;await poll()}generation=data.generation;cursor=data.cursor;pending=data.pending.filter(p=>p.params.threadId===selected);renderPending();let changed=false,refresh=data.refresh;for(const e of data.events){const p=e.params||{};if(p.threadId!==selected)continue;liveRevision++;if(e.method==='turn/started'){mergeTurn(p.turn);changed=true}else if(e.method==='turn/completed'){mergeTurn(p.turn);changed=true;refresh=true}else if(e.method==='item/started'||e.method==='item/completed'){const t=ensureTurn(p.turnId);if(p.item.type==='userMessage')t.items=t.items.filter(i=>!i.id.startsWith('submitted-'));const i=t.items.findIndex(x=>x.id===p.item.id);if(i<0)t.items.push(p.item);else t.items[i]=p.item;changed=true}else if(e.method==='item/agentMessage/delta'){const t=ensureTurn(p.turnId);let i=t.items.find(i=>i.id===p.itemId);if(!i){i={id:p.itemId,type:'agentMessage',text:''};t.items.push(i)}i.text+=p.delta;changed=true}else if(e.method==='item/commandExecution/outputDelta'){const t=ensureTurn(p.turnId),i=t.items.find(i=>i.id===p.itemId);if(i){i.aggregatedOutput=(i.aggregatedOutput||'')+p.delta;changed=true}}else if(e.method==='error')notice(p.error?.message||'Codex 执行失败');if(p.refresh)refresh=true}if(changed)render();controls();if(refresh)await poll()}finally{pulling=false}}
function renderPending(){const signature=JSON.stringify(pending);if(signature===pendingSignature)return;pendingSignature=signature;$('pending').replaceChildren();for(const request of pending){const card=el('section'),p=request.params;card.append(el('strong',request.method.includes('requestUserInput')?'Codex 需要补充信息':'Codex 请求批准'));if(p.command)card.append(el('pre',p.command));if(p.reason)card.append(el('p',p.reason));if(request.method==='item/tool/requestUserInput'){const answers={};for(const q of p.questions||[]){card.append(el('p',q.question));const input=el('input');input.placeholder=(q.options||[]).map(o=>o.label).join(' / ');input.oninput=()=>answers[q.id]=[input.value];card.append(input)}card.append(button('提交回答',async()=>{await call('/approvals/'+request.id,'POST',{answers});await pull()}))}else{card.append(button('批准一次',async()=>{await call('/approvals/'+request.id,'POST',{decision:'accept'});await pull()}),button('拒绝',async()=>{await call('/approvals/'+request.id,'POST',{decision:'decline'});await pull()}))}$('pending').append(card)}}
$('composer').onsubmit=e=>{e.preventDefault();guard(async()=>{if(busy())return;const text=$('prompt').value.trim();if(!text)return;const files=[...attachments],model=$('model').value,effort=$('effort').value,mode=$('mode').value;submitting=true;outgoing={text,attachments:files};$('prompt').value='';$('prompt').style.height='';attachments=[];renderAttachments();renderOutgoing();controls();notice();let accepted=false;try{if(!selected){const row=await call('/threads','POST',{title:text.slice(0,80),model});selected=row.id;revision++;threadData={turns:[]};tasks.unshift({id:selected,title:text.slice(0,80),archived:0});$('title').textContent=text.slice(0,80);renderTasks()}const result=await call('/threads/'+selected+'/prompt','POST',{text,model,effort,mode,attachments:files});accepted=true;const turn=result.turn,live=threadData?.turns?.find(t=>t.id===turn.id);if(!live||live.status==='inProgress')mergeTurn(turn);const local=ensureTurn(turn.id);if(!local.items.some(i=>i.type==='userMessage'))local.items.unshift({id:'submitted-'+turn.id,type:'userMessage',content:[{type:'text',text},...files.map(path=>({type:'text',text:path}))]});outgoing=null;renderOutgoing();render();guard(pull)}catch(e){outgoing=null;renderOutgoing();if(!accepted&&!$('prompt').value){$('prompt').value=text;attachments=files;renderAttachments()}throw e}finally{submitting=false;controls()}})};
$('prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('composer').requestSubmit()}};
$('stop').onclick=()=>guard(async()=>{await call('/threads/'+selected+'/stop','POST',{});await poll()});
$('sidebar-toggle').onclick=()=>document.body.classList.toggle(matchMedia('(max-width:760px)').matches?'sidebar-open':'sidebar-collapsed');$('sidebar-close').onclick=()=>document.body.classList.remove('sidebar-open');$('new').onclick=()=>{draft();document.body.classList.remove('sidebar-open')};$('refresh').onclick=()=>guard(async()=>{await Promise.all([loadStatus(),loadTasks(),poll()])});$('history-filter').oninput=renderTasks;$('archived').onchange=()=>guard(loadTasks);
$('workspace').onchange=()=>guard(async()=>{workspace=$('workspace').value;cursor=0;draft();fileDirectory='';await initialize()});
function askFields(title,fields){return new Promise(resolve=>{const dialog=el('dialog'),form=el('form'),inputs={};form.append(el('h3',title));for(const field of fields){const label=el('label',field.label),input=el('input');input.value=field.value||'';input.required=true;input.setAttribute('aria-label',field.label);inputs[field.name]=input;label.append(input);form.append(label)}const save=el('button','保存');save.type='submit';const cancel=button('取消',()=>{dialog.close();dialog.remove();resolve(null)});form.append(save,cancel);form.onsubmit=e=>{e.preventDefault();const result=Object.fromEntries(Object.entries(inputs).map(([k,v])=>[k,v.value.trim()]));dialog.close();dialog.remove();resolve(result)};dialog.oncancel=()=>{dialog.remove();resolve(null)};dialog.append(form);document.body.append(dialog);dialog.showModal()})}
$('workspace-new').onclick=()=>guard(async()=>{const data=await askFields('新建工作区',[{name:'title',label:'工作区名称'},{name:'name',label:'工作区标识（小写字母/数字/连字符）'}]);if(data){await call('/workspaces','POST',data);await loadWorkspaces()}});
$('rename').onclick=()=>guard(async()=>{if(!selected)return;const data=await askFields('重命名任务',[{name:'title',label:'任务名称',value:$('title').textContent}]);if(data){await call('/threads/'+selected+'/edit','POST',data);await Promise.all([poll(),loadTasks()])}});
$('archive').onclick=()=>guard(async()=>{if(selected){await call('/threads/'+selected+'/edit','POST',{archived:!$('archived').checked});draft();await loadTasks()}});
function renderAttachments(){$('attachments').replaceChildren();for(const path of attachments){const chip=el('span',path,'attachment-chip');chip.append(button('×',()=>{attachments=attachments.filter(p=>p!==path);renderAttachments()}));$('attachments').append(chip)}}
$('attach').onclick=()=>$('upload').click();$('upload').onchange=()=>guard(async()=>{try{for(const f of $('upload').files){if(attachments.length>=10)throw Error('最多附加 10 个文件');if(f.size>2*1024*1024)throw Error('单文件限 2 MiB');const content=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=()=>reject(Error('读取文件失败'));r.readAsDataURL(f)});const path='attachments/'+Date.now()+'-'+f.name.replace(/[^a-zA-Z0-9._\-\u4e00-\u9fff]/g,'_');await call('/files/write','POST',{path,content,encoding:'base64'});attachments.push(path)}renderAttachments()}finally{$('upload').value=''}});
for(const b of document.querySelectorAll('[data-panel]'))b.onclick=()=>guard(()=>panel(b.dataset.panel));$('panel-close').onclick=()=>$('inspector').hidden=true;
async function panel(name){$('inspector').hidden=false;$('panel-title').textContent={files:'工作区文件',terminal:'工作区命令',changes:'文件变更',extensions:'技能与 MCP',audit:'操作审计'}[name];const host=$('panel-content');host.replaceChildren();if(name==='files'){await browse(fileDirectory)}else if(name==='terminal'){const input=el('textarea');input.placeholder='在当前容器工作区执行命令（最长 20 秒）';const output=el('pre');host.append(input,button('执行',async()=>{const d=await call('/terminal','POST',{command:input.value});output.textContent=d.output+'\n退出码：'+d.exit_code}),output)}else if(name==='changes'){const d=await call('/terminal','POST',{command:'git status --short && git diff --stat && git diff --no-ext-diff'});host.append(el('pre',d.output))}else{const d=await call(name==='extensions'?'/extensions':'/audit');host.append(el('pre',JSON.stringify(d,null,2)))}}
async function browse(path=''){const data=await call('/files','GET',undefined,{path});fileDirectory=path;const host=$('panel-content');host.replaceChildren(el('p','/workspace/'+path,'file-path'),button('上级',()=>browse(path.split('/').slice(0,-1).join('/'))),button('新建文件',()=>edit((path?path+'/':'')+'new.txt','',false)),button('刷新',()=>browse(path)));for(const f of data.items)host.append(button((f.directory?'▸ ':'')+f.name,()=>f.directory?browse(f.path):openFile(f.path)))}
async function openFile(path){const d=await call('/files/content','GET',undefined,{path});if(d.image){const dialog=el('dialog'),img=el('img');img.src=d.image;img.style.maxWidth='100%';dialog.append(el('p',path),img,button('关闭',()=>{dialog.close();dialog.remove()}));document.body.append(dialog);dialog.showModal()}else edit(path,d.content,true)}
function edit(path,content,overwrite){$('editor-title').textContent='编辑工作区文件';$('edit-path').value=path;$('edit-content').value=content;$('edit-overwrite').checked=overwrite;$('edit-notice').textContent='';$('editor').showModal()}
$('edit-close').onclick=()=>$('editor').close();$('edit-save').onclick=()=>guard(async()=>{await call('/files/write','POST',{path:$('edit-path').value,content:$('edit-content').value,overwrite:$('edit-overwrite').checked});$('edit-notice').textContent='已保存';$('edit-overwrite').checked=true});
$('settings').onclick=()=>guard(async()=>{await loadStatus();$('settings-dialog').showModal()});$('settings-close').onclick=()=>$('settings-dialog').close();$('login').onclick=()=>guard(async()=>{const d=await call('/account/login','POST',{type:$('login-type').value,api_key:$('api-key').value});$('api-key').value='';$('login-result').textContent=JSON.stringify(d,null,2);await loadStatus()});
setInterval(()=>{if(ready&&!document.hidden&&performance.now()-lastPullAt>(busy()?150:selected?1500:4000))guard(pull)},150);setInterval(()=>{if(ready&&selected&&!document.hidden)guard(poll)},20000);setInterval(()=>{if(ready&&!document.hidden&&!busy())guard(loadTasks)},30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ready){guard(pull);guard(poll)}});
$('prompt').addEventListener('input',()=>{$('prompt').style.height='auto';$('prompt').style.height=Math.min($('prompt').scrollHeight,180)+'px'});for(const b of document.querySelectorAll('[data-suggestion]'))b.onclick=()=>{$('prompt').value=b.dataset.suggestion;$('prompt').focus()};for(const b of document.querySelectorAll('.more-menu button'))b.addEventListener('click',()=>b.closest('details').open=false);
</script></body></html>
