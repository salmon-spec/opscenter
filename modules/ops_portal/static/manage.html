<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>运维门户管理</title><style>/* MANAGEMENT_CSS */</style></head><body>
<header><div><h1>运维门户</h1><p>统一管理应用入口、业务分组与默认快捷访问。</p></div><div class="actions"><button id="refresh">刷新</button><button id="new" class="primary">＋ 添加应用</button></div></header>
<div id="error" role="alert" hidden></div><div class="portal-address"><span>门户地址</span><code id="portal-url">连接中…</code><span id="revision"></span></div>
<div class="toolbar"><div id="domains"></div><label><input type="search" id="search" placeholder="搜索应用名称或地址" aria-label="搜索应用"></label><span id="count"></span></div>
<div class="table-wrap"><table><thead><tr><th>应用名称</th><th>访问地址</th><th>业务分组</th><th>显示</th><th>默认快捷栏</th><th>操作</th></tr></thead><tbody id="rows"><tr><td colspan="6">正在连接运维工作台…</td></tr></tbody></table></div>
<details><summary>最近修改记录</summary><div id="audit"></div></details><p class="footnote">应用内部登录由各系统负责。HTTP 可访问与完整内嵌分别验收。</p>
<dialog id="editor"><form id="form"><div class="dialog-head"><h2>应用配置</h2><button type="button" data-close>×</button></div><input name="id" type="hidden"><label>应用名称<input name="name" maxlength="80" required></label><label>访问地址<input name="url" type="url" maxlength="2000" required placeholder="https://example.internal/"></label><label>业务分组<select name="domain"><option value="平台支撑">基础平台</option><option value="运维场景">运维工作台</option><option value="众创共享">工具与应用</option></select></label><label>应用分类<input name="category" maxlength="80" required></label><label>说明<textarea name="description" maxlength="300" rows="3"></textarea></label><label class="checkbox"><input name="enabled" type="checkbox" checked>在门户显示</label><div class="dialog-actions"><button type="button" data-close>取消</button><button class="primary" id="save">保存</button></div></form></dialog>
<dialog id="remove-dialog"><h2>移除应用</h2><p id="remove-name"></p><p>应用服务和业务数据会保留，门户入口将被移除。</p><div class="dialog-actions"><button id="cancel-remove">取消</button><button id="confirm-remove" class="danger">移除入口</button></div></dialog>
<script>/* MANAGEMENT_JS */</script></body></html>
