<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salmon · 运维门户</title><link rel="stylesheet" href="/static/style.css"></head>
<body class="locked"><section id="portal-login"><form id="login-form"><div class="login-brand">Salmon <span>OPS PORTAL</span></div><h1>登录运维门户</h1><p>统一身份认证，登录后直接使用各应用。</p><label>账号<input name="username" autocomplete="username" required maxlength="100"></label><label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="1000"></label><p id="login-error" role="alert"></p><button id="login-button" class="primary">登录</button><small>仅限内网或 WireGuard 访问</small></form></section>
<header class="global-header"><a class="brand" href="#" id="desktop-home"><span class="brand-symbol">S</span><span class="brand-word">Salmon <small>OPS PORTAL</small></span></a><button class="launcher" id="launcher" title="应用桌面" aria-label="应用桌面"></button><nav id="navigation"></nav><span class="notice"><i></i> 私有工作空间</span><div class="header-tools"><button id="recent-menu" title="最近使用" aria-label="最近使用">◷</button><button id="manage" title="门户设置" aria-label="门户设置">⚙</button><button id="account" title="个人工作台">◉ <span>我的工作台</span></button><button id="logout" title="退出登录" aria-label="退出登录">⏻</button></div></header>
<main>
<div id="tabs" class="tabs"></div>
<section id="home"><div class="workspace-heading"><div><div class="workspace-kicker">WORKSPACE / OPERATIONS</div><h1>应用工作台<span class="title-dot">.</span></h1><p>基础设施、运维工具与业务应用，统一访问。</p></div><div class="heading-meta"><span class="environment-tag"><i></i> 内网环境</span><span id="catalog-summary"></span></div></div><div class="desktop-controls"><div id="categories" class="domain-tabs" role="tablist" aria-label="业务域"></div><label class="search"><input id="search" type="search" placeholder="请输入应用名称" aria-label="搜索应用"><span>⌕</span><kbd>/</kbd></label><button id="desktop-settings" class="desktop-settings" title="桌面设置" aria-label="桌面设置">⚙</button></div><div id="scope-title" class="scope-title" hidden></div><div id="cards" class="desktop-grid"></div><div id="empty" class="empty" hidden>未找到匹配的应用</div><div class="shortcut-bar"><span class="shortcut-title">快捷访问 <small>PINNED APPS</small></span><div class="quick-dock" id="dock" aria-label="快捷访问"></div><button class="shortcut-edit" id="shortcut-edit" title="管理快捷应用">自定义 <span>↗</span></button></div><div class="floating-tools"><button id="home-float" title="回到应用桌面" aria-label="回到应用桌面">⌂</button><button id="add" title="添加应用" aria-label="添加应用">＋</button></div></section>
<section id="workspace" hidden><div class="app-toolbar"><div><strong id="app-name"></strong><span id="app-url"></span></div><div><button id="reload">↻ 刷新</button><button id="fullscreen">⛶ 全屏</button><a id="external" class="button" target="_blank" rel="noopener noreferrer">↗ 独立打开</a><button id="app-details">详情</button></div></div><div id="frame-note" class="frame-note"></div><div class="module-workspace"><aside id="module-functions" aria-label="模块功能" hidden></aside><div id="frames"></div></div></section>
</main>
<dialog id="details"><div class="dialog-heading"><h2>应用详情</h2><button data-close="details" aria-label="关闭">×</button></div><div id="detail-content"></div><div id="detail-actions" class="dialog-actions"></div></dialog>
<dialog id="settings"><div class="dialog-heading"><h2>快捷访问</h2><button data-close="settings" aria-label="关闭">×</button></div><p class="hint">设置当前浏览器的快捷应用。应用目录可在“门户管理 → 门户配置管理”中维护。</p><div id="management-list"></div></dialog>
<div id="toast" role="status" hidden></div><script type="module" src="/static/app.js"></script></body></html>
