<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>自动化作业 · OpsCenter 0.2.0</title><link rel="stylesheet" href="../static/app.css"><script src="../static/app.js" defer></script></head>
<body><div id="ops-automation-preview">
<section class="au-login" id="login"><form id="login-form"><span class="op-tag">AUTOMATION</span><h1>自动化作业</h1><p>独立管理任务模板、主机清单与执行记录。</p><label>模块访问令牌<input class="op-field" name="token" type="password" autocomplete="current-password" required aria-describedby="token-help"></label><p class="op-small" id="token-help">首次启动后，从本模块数据目录的 admin-token 文件读取。</p><button class="op-button primary" type="submit">进入模块</button><p id="login-error" role="alert"></p></form><div class="au-login-aside"><h2>让重复操作<br>成为标准作业。</h2><p>主机健康巡检</p><p>Agent 版本核对</p><p>备份完整性校验</p><small>Semaphore 执行引擎 · OpsCenter 界面</small></div></section>
<main id="application" class="op-main" hidden>
<div class="op-navigation"><div class="op-tabs" role="tablist" aria-label="作业页面"><button class="op-tab" id="tab-templates" data-tab="templates" role="tab" aria-controls="content" aria-selected="true">任务模板</button><button class="op-tab" id="tab-tasks" data-tab="tasks" role="tab" aria-controls="content" aria-selected="false">执行历史</button><button class="op-tab" id="tab-inventories" data-tab="inventories" role="tab" aria-controls="content" aria-selected="false">主机清单</button><button class="op-tab" id="tab-schedules" data-tab="schedules" role="tab" aria-controls="content" aria-selected="false">定时计划</button></div></div>
<div id="mode-banner" class="au-banner" role="status" hidden></div><p id="page-error" role="alert" hidden></p>
<div class="op-toolbar"><input id="search" class="op-field op-search" type="search" aria-label="搜索当前页面" placeholder="搜索模板名称或脚本"><select id="status-filter" class="op-field" aria-label="执行状态" hidden><option value="">全部状态</option><option value="success">成功</option><option value="error">失败</option><option value="running">运行中</option><option value="waiting">等待中</option><option value="stopped">引擎已停止</option></select><span class="op-spacer"></span><span class="op-small" id="result-count">正在加载…</span><button class="op-button" data-action="refresh">刷新</button><button class="op-button" data-action="logout">退出</button><button class="op-button primary" data-action="create" hidden>＋ 新建模板</button><button class="op-button primary" id="add-resource" hidden></button></div>
<section id="content" role="tabpanel" aria-labelledby="tab-templates"></section><p id="notice" class="op-message" role="status" aria-live="polite"></p><footer class="op-footer"><span id="last-sync">等待同步</span></footer></main>
<dialog id="drawer" class="au-dialog" aria-labelledby="drawer-title"><div class="op-drawer-head"><div><h2 id="drawer-title"></h2><p id="drawer-subtitle" class="op-small"></p></div><button class="op-button" data-action="close" aria-label="关闭详情">×</button></div><div id="drawer-body"></div><p id="drawer-error" role="alert"></p></dialog>
</div></body></html>
