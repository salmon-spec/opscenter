# ============================================
# DEPRECATED (2026-08-05): 实际由 systemd 运行
# 本文件仅供参考，不再使用 Docker 部署后端
# 详见 backend/app/config.py 与 opscenter-backend.service
# ============================================
version: '3.8'

services:
  opscenter-backend:
    build: ./backend
    container_name: opscenter-backend
    restart: always
    ports:
      - "127.0.0.1:9091:9091"
    environment:
      - DATABASE_URL=${DATABASE_URL:?set DATABASE_URL in the environment}
      - LOCAL_HOST=ops.salmon.xin
      - OPS_JWT_SECRET=${OPS_JWT_SECRET:?set OPS_JWT_SECRET in the environment}
      - OPS_ADMIN_USER=${OPS_ADMIN_USER:-admin}
      - OPS_ADMIN_PASSWORD=${OPS_ADMIN_PASSWORD:?set OPS_ADMIN_PASSWORD in the environment}
      - CREDENTIAL_KEY=${CREDENTIAL_KEY:?set CREDENTIAL_KEY in the environment}
    volumes:
      - /opt/opscenter/frontend:/app/frontend:ro
      - /opt/opscenter/agent:/app/agent:ro
      - /opt/opscenter/backend/groups.json:/app/groups.json:ro
      - /opt/opscenter/backend/services.json:/app/services.json:ro
      - /root/.ssh:/root/.ssh:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

